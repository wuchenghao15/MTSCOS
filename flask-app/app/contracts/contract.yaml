# ============================================================================
# §10 前端API约定(对照 mtscos_api.js + mtscos_csrf.js)
# ============================================================================
frontend_convention:
  description: |
    前端API客户端(mtscos_api.js)与CSRF拦截器(mtscos_csrf.js)的契约消费方实现
    所有前端请求必须通过MTSCOSApi发起, 禁止直接fetch()绕过契约层
  api_client:
    file: flask-app/static/js/mtscos_api.js
    contract_version: "1.2.0"
    version: "1.2.0"
    response_parsing:
      contract_format: "code/msg/data/trace_id/timestamp/severity/repair_suggestion/design_tokens"
      legacy_compatibility: "自动检测 {success:true} 旧格式并兼容"
      success_check: "code === '0' (字符串零)"
      error_throw: "MtscosApiError (承载8字段错误响应)"
    methods:
      - request(url, options)  # 主入口
      - get(url, options)       # GET便捷
      - post(url, data, options)  # POST便捷
      - put(url, data, options)
      - patch(url, data, options)
      - delete(url, options) / del(url, options)  # del别名避免关键字冲突
      - all(tasks)              # 并行批量请求
      - upload(url, formData, options)  # 文件上传
    helpers:
      - showToast(message, severity, duration)  # severity→Element Plus Token
      - lookupException(code)  # 查询异常码字典
      - lookupSeverity(severity)  # 查询颜色Token
    error_class:
      name: MtscosApiError
      fields: [code, severity, repair_suggestion, design_tokens, trace_id, http_status, data, timestamp, route_path, blueprint]
      helpers:
        - isAuthError()         # 鉴权失败(可跳转登录)
        - isCSRFError()         # CSRF错误(可刷新Token)
        - isPermissionDenied()  # 权限不足
        - getDesignTokens()     # 渲染颜色Token
        - toJSON()              # 序列化为可日志对象
  csrf_interceptor:
    file: flask-app/static/js/mtscos_csrf.js
    version: "1.0.0"
    token_sources:
      primary: 'meta[name="csrf-token"]'
      fallback: 'cookie[csrf_token]'
    header_name: "X-CSRF-Token"
    state_changing_methods: [POST, PUT, DELETE, PATCH]  # GET/HEAD/OPTIONS跳过
    exception_handling:
      E_TOKEN_MISSING: "refreshToken() → 重试原请求"
      E_TOKEN_BREACH: "清除Token → 强制页面reload"
    concurrent_refresh: "多个并发请求共享同一refresh Promise(幂等)"
    refresh_endpoint: "/api/auth/csrf-token"
    decoupled: "可独立使用, 也可被MTSCOSApi.inject调用"
  integration_pattern: |
    // HTML模板引入(对照设计规范.md 静态资源约定)
    <script src="/static/js/mtscos_csrf.js"></script>
    <script src="/static/js/mtscos_api.js"></script>
    <script>
      // 成功调用
      MTSCOSApi.get('/api/health').then(data => console.log('健康:', data));
      // 错误处理(自动Toast + 可手动判断)
      MTSCOSApi.post('/api/ai/memory/save', {content: '笔记'})
        .catch(err => {
          if (err.isAuthError()) location.href = '/?redirect=' + encodeURIComponent(location.pathname);
          if (err.isCSRFError()) MTSCOSCSRF.handleError(err.code);
        });
    </script>

