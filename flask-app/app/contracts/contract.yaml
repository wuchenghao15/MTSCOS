      404: {file: "404.html", err_code: E_ROUTE_404,    severity: warning,  actions: "返回+首页+刷新"}
      500: {file: "500.html", err_code: E_SRV_500,      severity: critical, actions: "返回+首页+刷新"}
      502: {file: "502.html", err_code: E_SRV_502,      severity: error,    actions: "返回+首页+刷新"}
      503: {file: "503.html", err_code: E_MAINTENANCE,  severity: info,     actions: "返回+首页+刷新", extra: "§14 STEP_10版本升级流程参考"}
      504: {file: "504.html", err_code: E_SRV_504,      severity: error,    actions: "返回+首页+刷新"}
  error_handler_layer:
    file: flask-app/app/__init__.py
    function: _register_app_errorhandlers(app)
    handler_version: "1.0.0"
    coverage: [400, 401, 403, 404, 500, 502, 503, 504, "Exception(兜底→500)"]
    handlers_count: 9
    content_negotiation:
      strategy: "Accept头驱动"
      html_trigger: ["Accept=text/html", "Accept=*/*", "Accept为空"]
      json_trigger: "Accept=application/json"
      html_response: "render_template('<status>.html', trace_id=..., severity=..., err_code=...)"
      json_response: "对齐 §1 全局响应Schema 8字段(code/msg/data/trace_id/timestamp/severity/repair_suggestion/design_tokens)"
    trace_id:
      priority: ["g.trace_id", "request.header[X-Trace-Id]", "auto gen(UUID24hex前缀t)"]
      response_header: "X-Trace-Id: <trace_id>"
    fallback:
      template_render_error: "硬编码兜底HTML(不依赖任何模板/静态资源, 防止嵌套错误)"
      uncaught_exception: "Exception → 转HTTP 500 E_SRV_500 + logger.error堆栈"
  acceptance_indicators:
    A2_1_template_inheritance: "L1→L2三层继承生效, exception_base.html 被 8 个页面 extends 覆盖"
    A2_2_exception_pages_count: "8类HTTP异常(400/401/403/404/500/502/503/504) 全部有对应模板"
    A2_3_content_negotiation: "Accept=text/html 返回HTML, Accept=application/json 返回8字段JSON"
    A2_4_trace_id_audit: "所有异常响应均携带X-Trace-Id响应头, 模板渲染trace_id展示框"
    A2_5_design_token_usage: "异常页样式 100% 消费 Design Token, 零硬编码颜色/字号/间距"
    A2_6_401_redirect: "401 按钮携带 redirect 参数, 登录后可回跳原始请求路径"
    A2_7_theme_persistence: "MTSCOSTheme 初始化: 读取session→localStorage→跟随系统, 三色模式切换"
  review_status:
    self_check: PASS
    template_render: "8/8 模板均通过Jinja2 extends语法检查"
    errorhandler_registration: "9/9 处理器注册: 8HTTP + Exception兜底"
    negotiator_check: "Accept头协商: HTML分支 + JSON分支 双路覆盖"

# ============================================================================
# §13 三端异常页契约(模块2 L3 — admin/student/mobile)
# 对照: admin/admin_exception_base.html + student/student_exception_base.html
#       + mobile/mobile_exception_base.html + 三端各8异常页(24个)
#       + app/__init__.py _resolve_exception_template 智能分发
# ============================================================================
three_end_exception_pages:
  description: |
    三端异常页架构在§12 L2之上扩展L3设备外壳层, 实现admin/student/mobile端差异化:
      · admin端: 侧边栏布局, 主题色--el-color-primary(蓝), 面向管理员/教师
      · student端: 顶部导航布局, 主题色--el-color-success(绿), 面向学生/家长
      · mobile端: 紧凑全屏+底部TabBar, 主题色--el-color-warning(橙), 面向移动访客
    智能分发器 _resolve_exception_template 基于四级优先级自动选择模板:
      1) URL路径前缀(强信号) > 2) session.role > 3) User-Agent > 4) 默认L2
  template_layer_l3:
    base_files:
      admin:
        file: flask-app/templates/admin/admin_exception_base.html
        extends: "exception_base.html"  # L1基类
        chrome_style: sidebar  # 侧边栏 + 顶部工具栏
        theme_color: "--el-color-primary"  # 蓝
        layout: "flex(220px侧边栏 + 主区域)"
        nav_items: [仪表盘, 用户管理, 考试管理, 系统设置, 前台首页]
        body_class: "exception-page-admin"
      student:
        file: flask-app/templates/student/student_exception_base.html
        extends: "exception_base.html"  # L1基类
        chrome_style: topnav  # 顶部横向导航
        theme_color: "--el-color-success"  # 绿
        layout: "flex column(60px topnav + 异常区)"
        nav_items: [主页, 我的考试, 学习计划, 学分汇总, 退出]
        body_class: "exception-page-student"
      mobile:
        file: flask-app/templates/mobile/mobile_exception_base.html
        extends: "exception_base.html"  # L1基类
        chrome_style: tabbar  # 紧凑全屏 + 底部固定TabBar
        theme_color: "--el-color-warning"  # 橙
        layout: "full-screen + 80px底部TabBar占位"
        nav_items: [首页, 考试, 我的]
        body_class: "exception-page-mobile"
        touch_friendly: "按钮全宽44px高, 触摸友好"
    jinja_blocks_l3:
      - device_chrome  # L3设备外壳块(注入侧边栏/顶部导航/TabBar, 覆盖L1的居中布局)
      - page_footer    # L3页面底部块(闭合外壳div或追加底部TabBar)
    page_list_l3:
      admin:  # 8个异常页, 均extends admin_exception_base.html
        400: {file: "admin/400.html", err_code: E_TOKEN_MISSING,  actions: "返回+首页+刷新"}
        401: {file: "admin/401.html", err_code: E_AUTH_401,     actions: "🔐去登录+首页", special: "登录redirect"}
        403: {file: "admin/403.html", err_code: E_AUTH_403,     actions: "返回+首页+刷新"}
        404: {file: "admin/404.html", err_code: E_ROUTE_404,    actions: "返回+首页+刷新"}
        500: {file: "admin/500.html", err_code: E_SRV_500,      actions: "返回+首页+刷新"}
        502: {file: "admin/502.html", err_code: E_SRV_502,      actions: "返回+首页+刷新"}
        503: {file: "admin/503.html", err_code: E_MAINTENANCE,  actions: "返回+首页+刷新"}
        504: {file: "admin/504.html", err_code: E_SRV_504,      actions: "返回+首页+刷新"}
      student:  # 8个异常页, 均extends student_exception_base.html
        400: {file: "student/400.html", err_code: E_TOKEN_MISSING,  actions: "返回+主页+刷新"}
        401: {file: "student/401.html", err_code: E_AUTH_401,     actions: "🔐去登录+主页"}
        403: {file: "student/403.html", err_code: E_AUTH_403,     actions: "返回+主页+刷新"}
        404: {file: "student/404.html", err_code: E_ROUTE_404,    actions: "返回+主页+刷新"}
        500: {file: "student/500.html", err_code: E_SRV_500,      actions: "返回+主页+刷新"}
        502: {file: "student/502.html", err_code: E_SRV_502,      actions: "返回+主页+刷新"}
        503: {file: "student/503.html", err_code: E_MAINTENANCE,  actions: "返回+主页+刷新"}
        504: {file: "student/504.html", err_code: E_SRV_504,      actions: "返回+主页+刷新"}
      mobile:  # 8个异常页, 均extends mobile_exception_base.html
        400: {file: "mobile/400.html", err_code: E_TOKEN_MISSING,  actions: "返回+首页"}
        401: {file: "mobile/401.html", err_code: E_AUTH_401,     actions: "🔐去登录+首页"}
        403: {file: "mobile/403.html", err_code: E_AUTH_403,     actions: "返回+首页"}
        404: {file: "mobile/404.html", err_code: E_ROUTE_404,    actions: "返回+首页"}
        500: {file: "mobile/500.html", err_code: E_SRV_500,      actions: "返回+首页"}
        502: {file: "mobile/502.html", err_code: E_SRV_502,      actions: "返回+首页"}
        503: {file: "mobile/503.html", err_code: E_MAINTENANCE,  actions: "返回+首页"}
        504: {file: "mobile/504.html", err_code: E_SRV_504,      actions: "返回+首页"}
  dispatcher_layer:
    file: flask-app/app/__init__.py
    function: _resolve_exception_template(http_status)
    location: "_register_app_errorhandlers 内, 被 _response_for 调用"
    dispatch_version: "1.0.0"
    priority_chain:  # 四级优先级, 命中即返回
      1_url_prefix:
        description: "URL路径前缀(强信号: 用户明确访问某端)"
        admin: ["path.startswith('/admin/')", "path.startswith('/admin_app/')", "path == '/admin'"]
        student: ["path.startswith('/student/')", "path == '/student'"]
        mobile: ["path.startswith('/mobile/')", "path == '/mobile'"]
        return: "f'{device}/{http_status}.html'"
      2_session_role:
        description: "已登录用户按session.role推断端(对照用户权限.md 11角色)"
        role_to_device_map:
          admin: [admin, super_admin, teacher, principal, teaching_leader, academic_affairs, operator]
          student: [student, student_vip, parent, adult_student]
          guest: []  # guest无映射, 走默认L2
        return: "f'{device}/{http_status}.html'"
      3_user_agent:
        description: "未登录访客, 手机浏览器UA检测"
        mobile_keywords: [Mobile, Android, iPhone, iPad, "Windows Phone", MicroMessenger]
        return: "f'mobile/{http_status}.html'"
      4_default_fallback:
        description: "默认回退: L2标准异常页(无端外壳)"
        return: "f'{http_status}.html'"
    integration_point: |
      _response_for(http_status, exc):
        if _wants_html():
            template_name = _resolve_exception_template(http_status)  # ← 三端分发
            html = render_template(template_name, trace_id=..., severity=..., err_code=...)
            resp = make_response(html, http_status)
            resp.headers['X-Trace-Id'] = trace_id  # 审计追踪头
            return resp
    fallback_chain: |
      模板渲染失败 → 硬编码兜底HTML(不依赖任何模板/静态资源, 防止嵌套错误)
      → 对照 §12 error_handler_layer.fallback
  role_device_mapping:
    description: "角色→端映射(对照用户权限.md §1 11角色定义)"
    note: "guest角色无映射, 走默认L2标准异常页(无端外壳)"
    mapping:
      admin: admin        # 管理员
      super_admin: admin  # 超级管理员(VIKEY强认证)
      teacher: admin      # 教师
      principal: admin   # 校长
      teaching_leader: admin  # 教研组长
      academic_affairs: admin # 教务
      operator: admin    # 运营
      student: student   # 学生
      student_vip: student  # VIP学生
      parent: student   # 家长
      adult_student: student  # 成人学生(对照caopw用户)
  mobile_ua_detection:
    description: "移动端User-Agent关键字检测(未登录访客)"
    keywords: [Mobile, Android, iPhone, iPad, "Windows Phone", MicroMessenger]
    logic: "any(kw in ua for kw in keywords)"
    note: "MicroMessenger覆盖微信内置浏览器"
  acceptance_indicators:
    A2_L3_1_three_end_bases: "3端基类(admin/student/mobile exception_base.html)全部创建, extends L1基类"
    A2_L3_2_pages_per_end: "每端8类异常页(400/401/403/404/500/502/503/504), 共24个L3模板"
    A2_L3_3_dispatch_priority: "四级优先级分发生效: URL前缀>session.role>User-Agent>默认L2"
    A2_L3_4_role_mapping: "11角色→3端映射完整, guest走默认L2(对照用户权限.md)"
    A2_L3_5_ua_detection: "6个移动UA关键字检测(Mobile/Android/iPhone/iPad/WinPhone/MicroMessenger)"
    A2_L3_6_design_token_alignment: "三端主题色分别消费 --el-color-primary/success/warning, 零硬编码"
    A2_L3_7_chrome_style: "admin=sidebar/student=topnav/mobile=tabbar, 三种差异化设备外壳"
    A2_L3_8_x_trace_id: "所有三端HTML响应均携带X-Trace-Id响应头, 审计追踪一致"
  review_status:
    self_check: PASS
    template_count: "27个(3基类+24异常页)"
    extends_chain: "L3 → L2基类 → L1 exception_base.html 三层继承生效"
    dispatcher_integration: "_resolve_exception_template 已集成到 _response_for, URL前缀/role/UA/L2四级分发"
    syntax_check:
      jinja_extends: "24/24 L3模板 extends 路径正确(admin/admin_exception_base.html等)"
      python: "_resolve_exception_template py_compile 通过"
    fallback_coverage: "模板渲染失败兜底HTML + 未匹配走L2, 双层容错"

