# ============================================================================
# §1 全局响应Schema(统一格式)
# ============================================================================
global_response_schema:
  description: |
    所有API响应必须遵循统一8字段格式(对照mtscos_response.build_*_response)
    成功: code=0, msg=操作成功, data=业务对象, trace_id贯穿日志
    失败: code=异常码(如E_AUTH_401), data=null, severity渲染主题
  fields:
    code:
      type: string
      description: 0=成功; 非0=异常码(对照mt_exception_code_dict)
      example_success: "0"
      example_error: "E_AUTH_401"
      frontend_field: code
      backend_field: code
      db_field: N/A  # 业务字段不入库
    msg:
      type: string
      description: 用户可读消息(中文)
      example: "操作成功"
      frontend_field: msg
      backend_field: msg
      db_field: N/A
    data:
      type: object | array | null
      description: 业务数据(失败时为null)
      example: {"id": 1, "name": "示例"}
      frontend_field: data
      backend_field: data
      db_field: 各资源表对应字段
    trace_id:
      type: string(16)
      description: UUID16请求追踪ID(贯穿日志+审计+前端)
      example: "a28f1cf032054f4d"
      frontend_field: trace_id
      backend_field: trace_id
      db_field: mt_permission_audit_detail.request_id
    timestamp:
      type: ISO8601
      description: 服务器ISO时间戳
      example: "2026-08-17T20:00:00+08:00"
      frontend_field: timestamp
      backend_field: timestamp
      db_field: N/A
    severity:
      type: enum
      description: 仅错误响应存在(info/warning/error/critical)
      frontend_field: severity
      backend_field: severity
      db_field: mt_exception_code_dict.severity
    repair_suggestion:
      type: string
      description: 仅错误响应存在,修复建议
      frontend_field: repair_suggestion
      backend_field: repair_suggestion
      db_field: mt_exception_code_dict.repair_suggestion
    design_tokens:
      type: string
      description: 仅错误响应存在,Element Plus Design Token颜色映射
      frontend_field: design_tokens
      backend_field: design_tokens
      db_field: mt_exception_code_dict.design_tokens

# ============================================================================
# §2 分页响应Schema(列表查询统一格式)
# ============================================================================
paginated_response_schema:
  description: |
    列表查询统一分页格式(对照mtscos_response.build_paginated_response)
  fields:
    code: {type: string, example: "0"}
    msg: {type: string, example: "查询成功"}
    data:
      type: object
      fields:
        items:
          type: array
          description: 当前页记录数组
          frontend_field: items
          backend_field: items
          db_field: 资源表SELECT结果
        pagination:
          type: object
          fields:
            page: {type: int, example: 1, frontend_field: page, db_field: N/A}
            per_page: {type: int, example: 20, frontend_field: per_page, db_field: N/A}
            total: {type: int, example: 100, frontend_field: total, db_field: COUNT(*)}
            pages: {type: int, example: 5, frontend_field: pages, db_field: 计算字段}
    trace_id: {type: string(16), example: "a28f1cf032054f4d"}

# ============================================================================
# §3 全局异常码字典对照(对照mt_exception_code_dict 20条Seed)
# ============================================================================
exception_codes:
  E_AUTH_401:        {http: 401, severity: error,    title: "未登录或登录已过期",   perm: login}
  E_AUTH_403:        {http: 403, severity: critical, title: "权限不足，禁止访问",    perm: admin}
  E_ROUTE_404:       {http: 404, severity: warning,  title: "页面/接口不存在",       perm: guest}
  E_SRV_500:         {http: 500, severity: critical, title: "服务器内部错误",        perm: guest}
  E_SRV_502:         {http: 502, severity: error,    title: "上游网关错误",          perm: guest}
  E_SRV_504:         {http: 504, severity: error,    title: "网关超时",              perm: guest}
  E_MAINTENANCE:     {http: 503, severity: info,     title: "系统维护中",            perm: guest}
  E_TIMEOUT:         {http: 504, severity: error,    title: "请求处理超时",          perm: guest}
  E_TOKEN_MISSING:  {http: 400, severity: warning,  title: "CSRF Token缺失",       perm: guest}
  E_TOKEN_BREACH:    {http: 403, severity: error,    title: "CSRF Token不匹配",      perm: login}
  E_PERM_GROUP:      {http: 403, severity: error,    title: "用户组别不匹配",        perm: login}
  E_PERM_STATUS:     {http: 403, severity: error,    title: "账号被禁用",            perm: login}
  E_PERM_ANOMALY:    {http: 403, severity: warning,  title: "账号存在异常标记",      perm: login}
  E_PERM_ILLEGAL:    {http: 403, severity: critical, title: "VIKEY合法性校验失败",   perm: super_admin}
  E_PERM_TIMESTAMP:  {http: 401, severity: warning,  title: "登录时间戳过期",        perm: login}
  E_BP_FAIL:         {http: 500, severity: error,    title: "蓝图注册失败",           perm: guest}
  E_DB_CONSTRAINT:   {http: 500, severity: error,    title: "数据库约束失败",        perm: guest}
  E_DB_ENCRYPT:      {http: 500, severity: critical, title: "数据库字段加密失败",    perm: guest}
  E_RATE_LIMIT:      {http: 429, severity: warning,  title: "请求频率超限",          perm: guest}
  E_ABI_VERSION:     {http: 500, severity: error,    title: "版本ABI不兼容",         perm: guest}

# ============================================================================
# §4 权限级定义(对照@system_container 4级+用户权限.md 11角色)
# ============================================================================
permission_levels:
  guest:       {description: "访客(未登录可访问)",     allowed_roles: [guest]}
  login:       {description: "登录用户(任意已登录)",   allowed_roles: [student, student_vip, teacher]}
  admin:       {description: "管理员",                allowed_roles: [admin, system_admin, hardware_admin, hardware_vikey_admin]}
  super_admin: {description: "超级管理员(唯一+VIKEY)", allowed_roles: [super_admin]}

