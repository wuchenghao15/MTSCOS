design_system:
  description: |
    MTSCOS前端设计系统, 基于Element Plus Design Token变量体系
    所有页面必须先加载mtscos_design_tokens.css再加载mtscos_components.css
    交互行为通过mtscos_components.js提供, 无第三方依赖(纯原生JS)
  token_layer:
    file: flask-app/static/css/mtscos_design_tokens.css
    version: "1.0.0"
    lines: 463
    variable_prefix:
      el: "--el-*"        # Element Plus原生变量(颜色/字体/边框/圆角)
      mtscos: "--mtscos-*"  # 项目扩展变量(间距/组件/玻璃态/动画)
    systems:
      - 颜色系统(主色#409EFF青蓝 + 6阶light/dark + 状态色success/warning/danger/info/critical)
      - 字体系统(4级字号 12/14/16/20px + 3级字重 regular/medium/bold + 行高)
      - 间距系统(8px基础单位, 8级 xs/sm/md/lg/xl/2xl/3xl/4xl)
      - 圆角系统(5级 small/base/large/round/circle)
      - 阴影系统(5级 hover/normal/light/lighter/dark)
      - 动画系统(6种 transition + 8种 keyframes)
      - 按钮四维组合模型(类型×尺寸×状态×形状)
      - 玻璃态变量(背景/模糊度/边框/阴影)
    theme_support:
      light: ":root"                    # 默认明色
      dark: '[data-theme="dark"]'      # 暗色切换
      auto: 'prefers-color-scheme'      # 跟随系统
  components_layer:
    file: flask-app/static/css/mtscos_components.css
    version: "1.0.0"
    lines: 814
    components_count: 15
    components:
      - mtscos-btn          # 按钮(四维组合: 6类型×3尺寸×5状态×4形状)
      - mtscos-card         # 卡片(支持玻璃态变体--glass)
      - mtscos-form         # 表单(input/textarea/select/checkbox/radio)
      - mtscos-table        # 表格(响应式+斑马纹+固定表头)
      - mtscos-modal        # 模态框(3尺寸+居中动画+ESC关闭)
      - mtscos-toast        # 通知条(4类型+8方向+自动消失)
      - mtscos-badge        # 标签徽章(5类型 dot/round/tag/circle/square)
      - mtscos-tag          # 标签(可关闭+6颜色)
      - mtscos-loading      # 加载态(3种 spinner/dots/skeleton)
      - mtscos-pagination   # 分页器(prev/next/jumper)
      - mtscos-breadcrumb   # 面包屑(支持分隔符自定义)
      - mtscos-empty        # 空状态(图标+文案+操作)
      - mtscos-exception    # 异常页(401/403/404/500/503 5类, 含trace_id)
      - mtscos-row/col      # 栅格(12列 + 5断点 xs/sm/md/lg/xl, row+col组合)
      - mtscos-text/p/flex  # 工具类(text颜色/p间距/flex布局, 200+)
    design_token_dependency: "100%消费mtscos_design_tokens.css变量, 禁止硬编码颜色/尺寸"
  interaction_layer:
    file: flask-app/static/js/mtscos_components.js
    version: "1.0.0"
    lines: 492
    components_count: 7
    components:
      - name: MTSCOSModal
        description: 模态框组件, 支持Promise化API + ESC关闭 + 点击遮罩关闭 + z-index堆叠
      - name: MTSCOSConfirm
        description: 确认对话框, Promise化, 支持自定义按钮文案+danger样式
      - name: MTSCOSToast
        description: Toast通知条, 4类型(success/warning/danger/info) + 自动消失 + 手动关闭
      - name: MTSCOSExceptionPage
        description: 异常页渲染器, 内置8异常码映射(401/403/404/500/503等), 支持trace_id+修复建议+自定义按钮
      - name: MTSCOSTheme
        description: 主题切换, 支持light/dark/auto三模式 + localStorage持久化 + 系统偏好跟随
      - name: MTSCOSForm
        description: 表单校验, 支持8种规则(required/email/phone/idcard/length/min/max/pattern)
      - name: MTSCOSLoader
        description: 加载态管理, 3种形态(spinner/dots/skeleton) + 全屏遮罩 + 容器加载
