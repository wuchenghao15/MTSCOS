# ============================================================================
# §6 字段对齐矩阵(前端字段=后端字段=DB字段 三对齐)
# ============================================================================
field_alignment_matrix:
  # 资源: agent (对照 agent_management_api)
  agent:
    frontend: {id: agent_id, name: name, role: role, status: status, created_at: created_at}
    backend: {agent_id: agent_id, name: name, role: role, status: status, created_at: created_at}
    db: {agent_id: TEXT PRIMARY KEY, name: TEXT NOT NULL, role: TEXT, status: TEXT DEFAULT 'active', created_at: TEXT DEFAULT (datetime('now'))}
    alignment_status: ALIGNED
  # 资源: ai_employee (对照 ai_dashboard_api)
  ai_employee:
    frontend: {id: employee_id, name: name, role: role, status: status, brain_id: brain_id, cluster_id: cluster_id}
    backend: {employee_id: employee_id, name: name, role: role, status: status, brain_id: brain_id, cluster_id: cluster_id}
    db: {employee_id: TEXT PRIMARY KEY, name: TEXT, role: TEXT, status: TEXT, brain_id: TEXT, cluster_id: TEXT}
    alignment_status: ALIGNED
  # 资源: activity_log (对照 activity_api)
  activity_log:
    frontend: {id: activity_id, user_id: user_id, action: action, target: target, ip: ip, timestamp: timestamp}
    backend: {activity_id: activity_id, user_id: user_id, action: action, target: target, ip: ip, timestamp: timestamp}
    db: {activity_id: INTEGER PK, user_id: TEXT, action: TEXT, target: TEXT, ip: TEXT, timestamp: TEXT}
    alignment_status: ALIGNED
  # 资源: system_config (对照 config_api)
  system_config:
    frontend: {section: section, key: key, value: value, type: type, updated_at: updated_at}
    backend: {section: section, key: key, value: value, type: type, updated_at: updated_at}
    db: {section: TEXT, key: TEXT, value: TEXT, type: TEXT, updated_at: TEXT, PRIMARY_KEY: (section, key)}
