# ============================================================================
# MTSCOS 共享接口契约层 contract.yaml (OpenAPI 3.0 风格)
# ============================================================================
# §14 IRON_RULE · STEP_7_EXECUTE · 模块1 后端Blueprint P2
# flow_id: flow_dev_pages_functions_complete_20260818_001
# 目标版本: v21.12.1 (L3_FIX基于v21.12.0)
# 基准版本: v21.12.0
#
# 设计目标(对齐 §14 张晓峰综2 + 开发规则 §21 API契约100%对齐):
#   前端字段 = 后端字段 = DB字段 三对齐
#   所有路由统一响应格式 {code, msg, data, trace_id, timestamp, severity, repair_suggestion, design_tokens}
#   所有路由权限级对照 @system_container 4级 (guest/login/admin/super_admin)
#   异常码对照 mt_exception_code_dict 20条 (模块4 P1-A Seed)
#
# 数据来源(扫描结论):
#   - 35个 api/*_api.py Blueprint
#   - 23+端点(/api/ai/* 23个, 其他业务域各2个)
#   - 现有响应字段top10: success/data/message/error/code/total/items/timestamp/status/results
#   - 装饰器覆盖: require_login 23 + require_admin 8 + require_super_admin 1 = 32次
#   - 不统一模式5条(裸dict/嵌套不一致/字段乱用/包装不统一/错误码不一致)
# ============================================================================

