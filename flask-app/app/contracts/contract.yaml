# ============================================================================
# §12 异常页模板 + 全局错误处理器 契约(模块2 P2a/P2b)
# 对照: exception_base.html + 400/401/403/404/500/502/503/504.html + app/__init__.py _register_app_errorhandlers
# ============================================================================
exception_pages:
  description: |
    三层继承结构:  L1 exception_base.html (Jinja2基类)
                 → L2 8个HTTP异常页(400/401/403/404/500/502/503/504)
                 → L3 三端页面(admin/student/mobile, 详见§13章节)
    全局错误处理器基于Accept头内容协商:
      · Accept: text/html (浏览器) → 渲染HTML异常页(三端分发见§13)
      · Accept: application/json (AJAX) → 8字段JSON响应(§1全局Schema)
  template_layer:
    base_file: flask-app/templates/exception_base.html
    base_version: "1.0.0"
    base_lines: 187
    jinja_blocks:
      - page_title          # 浏览器<title>
      - exception_meta      # 元信息(status/err_code/title/description/repair/severity/icon)
      - exception_actions   # 操作按钮区域(401特例: 追加"去登录"按钮)
      - extra_content       # 自定义内容(技术说明/补充提示)
    template_inheritance:
      pattern: "{% extends 'exception_base.html' %}"
      variables:
        - status          # HTTP状态码(400/401/403/404/500/502/503/504)
        - err_code        # 对照§3 exception_codes (E_AUTH_401等)
        - title           # 异常标题
        - description     # 异常描述
        - repair          # 修复建议 (对应§1 repair_suggestion字段)
        - severity        # 严重级(info/warning/error/critical → severity--*背景Token)
        - icon            # 状态图标emoji
        - trace_id        # 运维审计追踪(对应X-Trace-Id响应头)
    resource_consumption:
      css: ["/static/css/mtscos_design_tokens.css", "/static/css/mtscos_components.css"]
      js:  ["/static/js/mtscos_components.js"]
      design_token_alignment: "100%消费 --el-* 和 --mtscos-* 变量, 零硬编码"
