<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小龙 · 开启其他功能</title>
<style>
:root{--bg:#0b1020;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#eaf0ff;--sub:#8fa0c4;--b1:#4f8cff;--b2:#8b5cf6;--ok:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1000px 520px at 20% -10%,#1b2a52,transparent 60%),radial-gradient(800px 460px at 90% 110%,#2a1b52,transparent 55%),var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"PingFang SC",sans-serif;padding:28px 18px 60px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:21px;margin:0 0 6px}
p.sub{color:var(--sub);font-size:13px;margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--sub);font-weight:600;letter-spacing:.3px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px}
.row:last-child{border:none}
.row span:first-child{color:var(--sub)}
.tag{padding:2px 9px;border-radius:999px;font-size:12px}
.tag.ok{background:rgba(34,197,94,.16);color:#86efac}
.tag.pending{background:rgba(245,158,11,.16);color:#fcd34d}
.tag.no{background:rgba(239,68,68,.16);color:#fca5a5}
textarea{width:100%;min-height:88px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font:inherit;resize:vertical;outline:none}
textarea:focus{border-color:rgba(79,140,255,.6)}
button{margin-top:12px;width:100%;padding:12px;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;background:linear-gradient(135deg,var(--b1),var(--b2))}
button:disabled{opacity:.5}
.note{color:var(--warn);font-size:13px;margin-bottom:14px}
a.back{display:inline-block;margin-top:18px;color:#c7d5ff;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>小龙账号 · 功能权限</h1>
  <p class="sub">账号 {{ user.username }} — 小龙端注册的账号默认只开放聊天系统</p>

  {% if blocked %}<div class="note">⚠️ 您访问的功能尚未对小龙账号开放，请在下方提交申请。</div>{% endif %}

  <div class="card">
    <h2>当前权限</h2>
    <div class="row"><span>聊天系统</span><span class="tag ok">已开放</span></div>
    <div class="row"><span>其他功能（题库/考试/AI/系统等）</span><span id="fullTag" class="tag no">未开放</span></div>
    <div class="row"><span>申请状态</span><span id="reqTag" class="tag no">未申请</span></div>
  </div>

  <div class="card">
    <h2>申请开通</h2>
    <textarea id="reason" placeholder="请说明用途，例如：需要使用题库与考试功能（选填）"></textarea>
    <button id="btn">提交开通申请</button>
  </div>

  <a class="back" href="/xiaolong">← 返回小龙</a>
</div>
<script>
const TAGS={NONE:['未申请','no'],PENDING:['审核中','pending'],APPROVED:['已通过','ok'],REJECTED:['已驳回','no']};
async function load(){
  const r=await fetch('/api/xiaolong/scope/my');
  if(!r.ok) return;
  const j=await r.json(); const s=j.scope;
  if(!s){ document.getElementById('fullTag').textContent='非小龙账号'; return; }
  document.getElementById('fullTag').className='tag '+(s.full_access?'ok':'no');
  document.getElementById('fullTag').textContent=s.full_access?'已开放':'未开放';
  const t=TAGS[s.request_status]||TAGS.NONE;
  const el=document.getElementById('reqTag'); el.className='tag '+t[1]; el.textContent=t[0];
  if(s.full_access||s.request_status==='PENDING') document.getElementById('btn').disabled=true;
}
document.getElementById('btn').onclick=async()=>{
  const b=document.getElementById('btn'); b.disabled=true;
  const r=await fetch('/api/xiaolong/scope/request',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({reason:document.getElementById('reason').value})});
  const j=await r.json();
  if(j.success){ b.textContent='已提交，等待管理员审批'; load(); }
  else { b.disabled=false; b.textContent=j.message||'提交失败'; }
};
load();
</script>
</body>
</html>
