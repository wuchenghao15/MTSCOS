<!DOCTYPE html>
<html lang="zh-CN" data-theme="andromeda">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仙女座 · 本地聊天 | MTSCOS AI</title>
<style>
  :root{
    --mtscos-primary-base:#06b6d4;
    --mtscos-secondary-base:#a855f7;
    --bg:#0B0A1E;
    --panel:rgba(255,255,255,.04);
    --panel-hover:rgba(255,255,255,.08);
    --line:rgba(6,182,212,.25);
    --text:#f8fafc;
    --text-dim:rgba(248,250,252,.65);
    --text-faint:rgba(248,250,252,.35);
    --green:#6ee7b7;
    --red:#fca5a5;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:-apple-system,"SF Pro","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  
  .layout{display:grid;grid-template-columns:260px 1fr;height:100vh}
  
  /* ═══ 侧边栏 ═══ */
  .sidebar{background:rgba(6,182,212,.03);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .sidebar-header{padding:20px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--mtscos-primary-base),var(--mtscos-secondary-base));display:flex;align-items:center;justify-content:center;font-size:18px}
  .brand{font-weight:700;font-size:14px;letter-spacing:.5px}
  .brand-sub{font-size:10px;color:var(--text-dim);margin-top:2px}
  
  .new-session{margin:12px;padding:10px 12px;background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(168,85,247,.1));border:1px solid var(--line);border-radius:var(--radius);color:var(--mtscos-primary-base);cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:all .2s}
  .new-session:hover{background:linear-gradient(135deg,rgba(6,182,212,.25),rgba(168,85,247,.15));transform:translateY(-1px)}
  
  .session-list{flex:1;overflow-y:auto;padding:8px}
  .session-list::-webkit-scrollbar{width:4px}
  .session-list::-webkit-scrollbar-thumb{background:rgba(6,182,212,.3);border-radius:2px}
  
  .session-item{padding:12px;border-radius:12px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;transition:all .15s}
  .session-item:hover{background:var(--panel-hover);border-color:rgba(6,182,212,.15)}
  .session-item.active{background:rgba(6,182,212,.1);border-color:var(--line)}
  .session-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .session-last{font-size:11px;color:var(--text-dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .session-meta{font-size:10px;color:var(--text-faint);margin-top:4px;display:flex;gap:8px}
  
  .user-bar{padding:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--mtscos-primary-base),var(--mtscos-secondary-base));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .user-info{flex:1;min-width:0}
  .user-name{font-size:13px;font-weight:600}
  .user-cog{font-size:11px;color:var(--text-dim)}
  
  /* ═══ 聊天主区 ═══ */
  .chat-main{display:flex;flex-direction:column;overflow:hidden}
  .chat-header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}
  .chat-title{font-weight:600;font-size:15px;flex:1;min-width:0}
  .chat-stats{display:flex;gap:12px;font-size:11px;color:var(--text-dim)}
  .chat-stats span{display:flex;align-items:center;gap:4px}
  
  .messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
  .messages::-webkit-scrollbar{width:6px}
  .messages::-webkit-scrollbar-thumb{background:rgba(6,182,212,.3);border-radius:3px}
  
  .msg{max-width:80%;animation:fadein .25s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  
  .msg.user{align-self:flex-end}
  .msg.ai{align-self:flex-start}
  
  .msg-bubble{padding:14px 18px;border-radius:var(--radius);line-height:1.7;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .msg.user .msg-bubble{background:linear-gradient(135deg,rgba(6,182,212,.2),rgba(168,85,247,.15));border:1px solid rgba(6,182,212,.3)}
  .msg.ai .msg-bubble{background:var(--panel);border:1px solid var(--line)}
  
  .msg-meta{font-size:10px;color:var(--text-faint);margin-top:6px;display:flex;gap:10px}
  
  .thinking{display:flex;gap:6px;padding:4px 0}
  .thinking span{width:8px;height:8px;border-radius:50%;background:rgba(6,182,212,.6);animation:bounce 1.2s infinite}
  .thinking span:nth-child(2){animation-delay:.15s}
  .thinking span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
  
  .diverge-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3);margin-right:6px}
  .breakthrough-tag{background:rgba(110,231,183,.15);color:var(--green);border-color:rgba(110,231,183,.3)}
  .question-tag{background:rgba(248,113,113,.15);color:#f87171;border-color:rgba(248,113,113,.3)}
  
  /* ═══ 输入区 ═══ */
  .input-area{padding:16px 24px;border-top:1px solid var(--line);background:rgba(0,0,0,.2)}
  .input-wrapper{display:flex;gap:12px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;transition:all .2s}
  .input-wrapper:focus-within{border-color:var(--mtscos-primary-base);box-shadow:0 0 20px rgba(6,182,212,.1)}
  textarea.chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);resize:none;font-size:14px;line-height:1.6;min-height:24px;max-height:160px;font-family:inherit}
  .send-btn{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--mtscos-primary-base),var(--mtscos-secondary-base));border:none;color:#000;cursor:pointer;font-weight:700;transition:transform .15s}
  .send-btn:hover{transform:scale(1.05)}
  .send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  
  .input-hint{font-size:11px;color:var(--text-faint);margin-top:8px;display:flex;gap:16px}
  .input-hint span{display:flex;align-items:center;gap:4px}
  
  /* 空状态 */
  .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px}
</style>
</head>
<body>

<div class="layout">
  <!-- ══════ 侧边栏 ══════ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">🧠</div>
      <div>
        <div class="brand">仙女座聊天</div>
        <div class="brand-sub">Divergent Thinking Engine</div>
      </div>
    </div>
    
    <button class="new-session" onclick="newSession()">✨ 新建对话</button>
    
    <div class="session-list" id="sessionList">
      <div class="empty" id="noSessions">加载会话中...</div>
    </div>
    
    <div class="user-bar">
      <div class="avatar" id="avatar">U</div>
      <div class="user-info">
        <div class="user-name" id="userName">加载中...</div>
        <div class="user-cog" id="userCog">🧠 仙女座发散思维引擎</div>
      </div>
    </div>
  </aside>
  
  <!-- ══════ 聊天主区 ══════ -->
  <main class="chat-main">
    <div class="chat-header">
      <div class="chat-title" id="chatTitle">选择或新建一个对话</div>
      <div class="chat-stats">
        <span>⚡ 本地 Ollama</span>
        <span>🧠 仙女座发散</span>
        <span>📊 0拐点</span>
      </div>
    </div>
    
    <div class="messages" id="messages">
      <div class="empty">👈 点击左侧「新建对话」开始<br>· 本地 LLM 零 token 消耗<br>· 仙女座发散思维引擎<br>· 所有对话永久化 + 脑库投喂</div>
    </div>
    
    <div class="input-area">
      <div class="input-wrapper">
        <textarea class="chat-input" id="input" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()" disabled>↑</button>
      </div>
      <div class="input-hint">
        <span>💡 试试: 如果明天太阳不发光, 人类会怎样?</span>
        <span>🧠 仙女座发散思维引擎</span>
      </div>
    </div>
  </main>
</div>

<script>
let currentSessionId = null;
let isStreaming = false;

const $ = id => document.getElementById(id);
const API = '/api/local-chat';

// ═══ 初始化 ═══
function init(){
  // 用户名 / 头像
  fetch('/api/auth/me').then(r=>r.json()).then(d=>{
    if(d.username){
      $('userName').textContent = d.username;
      $('avatar').textContent = d.username[0].toUpperCase();
    }
  }).catch(()=>{
    $('userName').textContent = '用户';
  });
  
  loadSessions();
  bindEnter();
}

// ═══ 会话列表 ═══
async function loadSessions(){
  try{
    const r = await fetch(`${API}/sessions`);
    const d = await r.json();
    if(!d.success) return;
    const list = $('sessionList');
    list.innerHTML = '';
    if(!d.sessions.length){
      list.innerHTML = '<div class="empty">暂无对话, 点击上方按钮新建 ✨</div>';
      return;
    }
    for(const s of d.sessions){
      const el = document.createElement('div');
      el.className = 'session-item' + (s.session_id === currentSessionId ? ' active' : '');
      el.innerHTML = `
        <div class="session-title">${escapeHtml(s.title || '未命名')}</div>
        <div class="session-last">${escapeHtml(s.last_message || '（空对话）')}</div>
        <div class="session-meta"><span>💬 ${s.message_count}</span><span>${s.updated_at || ''}</span></div>
      `;
      el.onclick = () => selectSession(s.session_id);
      list.appendChild(el);
    }
  }catch(e){}
}

async function newSession(){
  if(isStreaming) return;
  const r = await fetch(`${API}/session`, {method:'POST', headers:{'Content-Type':'application/json'}});
  const d = await r.json();
  if(d.success){
    currentSessionId = d.session_id;
    $('chatTitle').textContent = '新对话';
    $('messages').innerHTML = '<div class="empty">👋 你好! 开始一段发散思维之旅吧</div>';
    $('input').disabled = false;
    $('sendBtn').disabled = false;
    loadSessions();
    $('input').focus();
  }
}

async function selectSession(sid){
  if(isStreaming) return;
  currentSessionId = sid;
  const r = await fetch(`${API}/history?session_id=${sid}`);
  const d = await r.json();
  if(!d.success) return;
  
  $('messages').innerHTML = '';
  for(const m of d.messages){
    appendMessage(m.role, m.content, false);
  }
  // 标题从列表取
  document.querySelectorAll('.session-item').forEach(el=>el.classList.remove('active'));
  event?.currentTarget?.classList?.add('active');
}

// ═══ 发送消息 (SSE 流式) ═══
function bindEnter(){
  const t = $('input');
  t.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey && !isStreaming){
      e.preventDefault();
      send();
    }
  });
  t.addEventListener('input', ()=>{
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 160) + 'px';
  });
}

async function send(){
  const input = $('input');
  const text = input.value.trim();
  if(!text || isStreaming) return;
  
  if(!currentSessionId){
    await newSession();
  }
  
  isStreaming = true;
  $('sendBtn').disabled = true;
  $('input').disabled = true;
  
  appendMessage('user', text, true);
  input.value = '';
  input.style.height = 'auto';
  
  // AI 消息占位
  const aiMsg = appendMessage('assistant', '', true);
  const contentEl = aiMsg.querySelector('.msg-content');
  contentEl.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  
  try{
    const resp = await fetch(`${API}/send`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({session_id: currentSessionId, message: text})
    });
    
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';
    
    contentEl.innerHTML = '';
    const tagContainer = document.createElement('div');
    tagContainer.style.marginBottom = '8px';
    contentEl.appendChild(tagContainer);
    
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      
      const events = buffer.split('\n\n');
      buffer = events.pop();
      
      for(const evt of events){
        const lines = evt.split('\n');
        for(const line of lines){
          if(!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if(!payload) continue;
          
          if(payload === '[thinking]') continue;
          if(payload.startsWith('[error]')){
            try{
              const e = JSON.parse(payload.slice(7));
              contentEl.innerHTML = `<span style="color:#fca5a5">❌ ${e.error || 'AI 服务不可用'}</span>`;
            }catch(_){}
            break;
          }
          if(payload.startsWith('[done]')){
            // 拐点检测 (前端也根据关键词给 tag)
            tagContainer.innerHTML = detectInflectionTags(text, fullText);
            break;
          }
          
          try{
            const d = JSON.parse(payload);
            if(d.token){
              fullText += d.token;
              // 逐步渲染 markdown 简化版
              contentEl.innerHTML = detectInflectionTags(text, fullText) + escapeHtml(fullText).replace(/\n/g,'<br>');
              scrollBottom();
            }
          }catch(_){}
        }
      }
    }
  }catch(err){
    contentEl.innerHTML = `<span style="color:#fca5a5">❌ 连接断开: ${err.message}</span>`;
  }finally{
    isStreaming = false;
    $('sendBtn').disabled = false;
    $('input').disabled = false;
    $('input').focus();
    loadSessions();
  }
}

// ═══ 拐点标签 (前端可视化) ═══
function detectInflectionTags(userText, aiText){
  const text = userText + ' ' + aiText;
  const tags = [];
  if(/假设|如果|想象|倘若|万一|不妨/.test(userText)) tags.push('<span class="diverge-tag">🧭 发散思维</span>');
  if(/原来如此|恍然大悟|灵光|豁然开朗|突破/.test(aiText)) tags.push('<span class="diverge-tag breakthrough-tag">💡 灵感爆发</span>');
  if(/为什么|怎么会|难道|究竟/.test(userText)) tags.push('<span class="diverge-tag question-tag">❓ 深度追问</span>');
  return tags.join('');
}

// ═══ 消息渲染 ═══
function appendMessage(role, content, isNew){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  wrap.innerHTML = `
    <div class="msg-bubble">
      <div class="msg-content">${content ? escapeHtml(content).replace(/\n/g,'<br>') : ''}</div>
    </div>
    <div class="msg-meta">
      <span>${role === 'user' ? '👤 我' : '🧠 仙女座 AI'}</span>
      <span>${new Date().toLocaleTimeString()}</span>
    </div>
  `;
  $('messages').appendChild(wrap);
  scrollBottom();
  return wrap;
}

function scrollBottom(){
  const m = $('messages');
  m.scrollTop = m.scrollHeight;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

init();
</script>
</body>
</html>
