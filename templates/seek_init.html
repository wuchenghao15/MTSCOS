<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禅意 · Zenseek</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0e0e0f;
    --gold: #d4a84b;
    --gold-soft: #c9a96e;
    --gold-dim: rgba(212, 168, 75, 0.35);
    --text-primary: #e8e4d9;
    --text-secondary: #9b9589;
    --text-dim: #6b665c;
    --border: rgba(212, 168, 75, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Montserrat', 'Noto Serif SC', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── 页面容器 ─── */
  .wrap {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background: radial-gradient(ellipse at 50% 20%, #1a1a2e 0%, #0e0e0f 70%);
  }

  /* ─── 主卡片 ─── */
  .card {
    width: 100%;
    max-width: 400px;
    background: rgba(26, 26, 29, 0.72);
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 36px 32px;
    box-shadow: 0 0 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -1px; left: 36px; right: 36px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ─── 时间 ─── */
  .time {
    text-align: center;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .clock {
    font-family: 'Cormorant Garamond', serif;
    font-size: 58px;
    font-weight: 300;
    color: var(--gold);
    letter-spacing: 0.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .clock .sep {
    animation: blink 2s step-end infinite;
    color: var(--gold-dim);
  }
  @keyframes blink { 50% { opacity: 0.3; } }
  .date {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-secondary);
    margin-top: 10px;
  }
  .buddhist {
    font-family: 'Noto Serif SC', serif;
    font-size: 11px;
    color: var(--gold-soft);
    margin-top: 5px;
    opacity: 0.75;
  }

  /* ─── 佛教时间表 ─── */
  .schedule {
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  .schedule-title {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .schedule-title::before, .schedule-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .schedule-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    font-size: 13px;
  }
  .schedule-row .label {
    color: var(--text-secondary);
    font-family: 'Noto Serif SC', serif;
  }
  .schedule-row .time {
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .schedule-row.active .label { color: var(--gold); }
  .schedule-row.active .time { color: var(--gold-soft); }

  /* ─── 表单 ─── */
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 11px 13px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s ease;
    
  }
  .form-input::placeholder { color: var(--text-dim); }
  .form-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(212, 168, 75, 0.1);
    background: rgba(212, 168, 75, 0.03);
  }

  .btn {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: var(--bg-deep);
    border: 1px solid var(--gold);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
    margin-top: 4px;
  }
  .btn:hover {
    background: var(--gold-soft);
    box-shadow: 0 0 24px rgba(212, 168, 75, 0.3);
  }

  .switch {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .switch a {
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .switch a:hover { border-bottom-color: var(--gold); }

  /* ─── 面板切换 ─── */
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 420px) {
    .clock { font-size: 48px; }
    .card { padding: 28px 22px; }
  }
</style>
<style>/* a11y: 键盘焦点可见 */
:focus-visible{outline:2px solid #c9a227;outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">

    <!-- 时间 -->
    <div class="time">
      <div class="clock">
        <span id="hh">--</span><span class="sep">:</span><span id="mm">--</span><span class="sep">:</span><span id="ss">--</span>
      </div>
      <div class="date" id="date">——</div>
      <div class="buddhist" id="buddhist-date">——</div>
    </div>

    <!-- 佛教时间表 -->
    <div class="schedule">
      <div class="schedule-title">今日作息</div>
      <div id="schedule-list"></div>
    </div>

    <!-- 登录 -->
    <div id="login-panel" class="panel active">
      <div class="form-group">
        <label class="form-label">账号</label>
        <input class="form-input" id="login-user" type="text" placeholder="用户名或邮箱" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input class="form-input" id="login-pass" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="btn" id="btn-login">登录</button>
      <div class="switch">还没有账号？<a href="#" onclick="showRegister()">立即注册</a></div>
    </div>

    <!-- 注册 -->
    <div id="register-panel" class="panel">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input class="form-input" id="reg-user" type="text" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input class="form-input" id="reg-email" type="email" placeholder="请输入邮箱">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input class="form-input" id="reg-pass" type="password" placeholder="至少 8 位字符">
      </div>
      <button class="btn" id="btn-register">注册</button>
      <div class="switch">已有账号？<a href="#" onclick="showLogin()">返回登录</a></div>
    </div>

  </div>
</div>

<script>
/* ════════════════════════════════════════
   时间
════════════════════════════════════════ */
const buddhistMonths = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
const buddhistDays = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十',
                      '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
                      '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
const weekDays = ['日', '一', '二', '三', '四', '五', '六'];

function updateTime() {
  const now = new Date();
  document.getElementById('hh').textContent = String(now.getHours()).padStart(2, '0');
  document.getElementById('mm').textContent = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('ss').textContent = String(now.getSeconds()).padStart(2, '0');

  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  document.getElementById('date').textContent = `${y}年 ${m}月 ${d}日 · 星期${weekDays[now.getDay()]}`;
  document.getElementById('buddhist-date').textContent =
    `佛历 ${y + 543} 年 · ${buddhistMonths[(m-1)%12]}月${buddhistDays[(d-1)%30]}日`;

  updateSchedule(now);
}

/* ════════════════════════════════════════
   佛教时间表
════════════════════════════════════════ */
const schedule = [
  { label: '早课', time: '04:00' },
  { label: '早斋', time: '06:30' },
  { label: '午斋', time: '11:30' },
  { label: '晚课', time: '16:30' },
  { label: '药石', time: '19:30' },
  { label: '养息', time: '22:00' },
];

function updateSchedule(now) {
  const list = document.getElementById('schedule-list');
  const curMin = now.getHours() * 60 + now.getMinutes();
  let closest = schedule.reduce((prev, cur) => {
    const [h, m] = cur.time.split(':').map(Number);
    const cd = Math.abs(h * 60 + m - curMin);
    const [ph, pm] = prev.time.split(':').map(Number);
    const pd = Math.abs(ph * 60 + pm - curMin);
    return cd < pd ? cur : prev;
  });
  list.innerHTML = schedule.map(s =>
    `<div class="schedule-row${s === closest ? ' active' : ''}">
      <span class="label">${s.label}</span>
      <span class="time">${s.time}</span>
    </div>`
  ).join('');
}

updateTime();
setInterval(updateTime, 1000);

/* ════════════════════════════════════════
   面板切换 + 表单
════════════════════════════════════════ */
function showLogin() {
  document.getElementById('login-panel').classList.add('active');
  document.getElementById('register-panel').classList.remove('active');
}
function showRegister() {
  document.getElementById('register-panel').classList.add('active');
  document.getElementById('login-panel').classList.remove('active');
}

document.getElementById('btn-login').addEventListener('click', () => {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!user || !pass) { document.getElementById('login-pass').focus(); return; }
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: user, password: pass })
  }).then(r => r.json()).then(data => {
    if (data.ok) { location.href = '/seek/init'; }
    else alert(data.msg || '登录失败');
  }).catch(() => alert('登录成功（演示模式）'));
});

document.getElementById('btn-register').addEventListener('click', () => {
  const user = document.getElementById('reg-user').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  if (!user || !email || pass.length < 8) { alert('请检查输入（密码至少 8 位）'); return; }
  fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: user, email, password: pass })
  }).then(r => r.json()).then(data => {
    if (data.ok) showLogin();
    else alert(data.msg || '注册失败');
  }).catch(() => alert('注册请求已发送（演示模式）'));
});

['login-pass', 'reg-pass'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') e.target.closest('.panel').querySelector('.btn')?.click();
  });
});
</script>
{# 🎨 冰山主题矩阵调度器 #}

</body>
</html>
