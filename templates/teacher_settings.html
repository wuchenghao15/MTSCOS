{% extends "base.html" %}

{% block title %}教师设置 - MTSCOS AI{% endblock %}

{% block head %}
<style>
    :root {
        --dark-bg-primary: #0c0c1e;
        --dark-bg-secondary: #1a1a3e;
        --dark-bg-card: rgba(20, 20, 40, 0.85);
        --dark-border: rgba(99, 102, 241, 0.2);
        --dark-text-primary: #ffffff;
        --dark-text-secondary: #94a3b8;
        --dark-primary-color: #6366f1;
        --dark-success: #22c55e;
        --dark-warning: #f59e0b;
    }
    
    body { background: linear-gradient(135deg, var(--dark-bg-primary) 0%, var(--dark-bg-secondary) 50%, var(--dark-bg-primary) 100%); min-height: 100vh; }
    .settings-wrap { max-width: 900px; margin: 30px auto; padding: 0 16px; }
    .settings-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .settings-header h1 { font-size: 24px; color: var(--dark-text-primary); margin: 0; }
    
    .settings-tabs { display: flex; gap: 8px; background: var(--dark-bg-card); border: 1px solid var(--dark-border); border-radius: 12px; padding: 6px; margin-bottom: 24px; flex-wrap: wrap; }
    .settings-tab { padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--dark-text-secondary); transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
    .settings-tab:hover { color: var(--dark-text-primary); background: rgba(0,0,0,0.2); }
    .settings-tab.active { background: linear-gradient(135deg, var(--dark-primary-color), #8b5cf6); color: #fff; }
    
    .settings-section { display: none; }
    .settings-section.active { display: block; }
    
    .settings-card { background: var(--dark-bg-card); border: 1px solid var(--dark-border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
    .card-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--dark-border); }
    .card-head h2 { font-size: 16px; color: var(--dark-text-primary); margin: 0; }
    .card-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .card-icon.blue { background: rgba(59,130,246,0.15); color: #6366f1; }
    .card-icon.orange { background: rgba(249,115,22,0.15); color: #f59e0b; }
    .card-icon.green { background: rgba(34,197,94,0.15); color: #22c55e; }
    .card-icon.purple { background: rgba(168,85,247,0.15); color: #a855f7; }
    
    .card-body { padding: 20px 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--dark-text-secondary); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--dark-border); border-radius: 8px; background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; }
    
    .toggle { width: 44px; height: 24px; border-radius: 12px; background: #64748b; position: relative; cursor: pointer; transition: all 0.3s; display: inline-block; }
    .toggle::after { content: ''; width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; transition: all 0.3s; }
    .toggle.on { background: #6366f1; }
    .toggle.on::after { left: 22px; }
    
    .btn { padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }
    .btn-secondary { background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(99,102,241,0.2); }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: 700; color: #6366f1; }
    .stat-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    
    .course-list { display: grid; gap: 12px; }
    .course-item { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .course-info h4 { color: #fff; margin: 0; }
    .course-info p { color: #94a3b8; font-size: 12px; margin: 4px 0 0; }
</style>
{% endblock %}

{% block content %}
<div class="settings-wrap">
    <div class="settings-header">
        <div class="card-icon blue"><i class="fas fa-user-circle"></i></div>
        <h1>教师设置</h1>
    </div>

    <div class="settings-tabs">
        <div class="settings-tab active" onclick="showSection('section-profile')"><i class="fas fa-user"></i> 个人信息</div>
        <div class="settings-tab" onclick="showSection('section-courses')"><i class="fas fa-book"></i> 课程管理</div>
        <div class="settings-tab" onclick="showSection('section-students')"><i class="fas fa-users"></i> 学生管理</div>
        <div class="settings-tab" onclick="showSection('section-notifications')"><i class="fas fa-bell"></i> 通知设置</div>
        <div class="settings-tab" onclick="showSection('section-security')"><i class="fas fa-key"></i> 安全设置</div>
    </div>

    <div class="settings-section active" id="section-profile">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon blue"><i class="fas fa-user"></i></div>
                <h2>个人信息</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="profile-username" value="{{ user.username or '' }}" disabled>
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="profile-email" value="{{ user.email or '' }}" onchange="scheduleSave('profile')">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="profile-phone" value="{{ user.phone or '' }}" onchange="scheduleSave('profile')">
                </div>
                <div class="form-group">
                    <label>教师简介</label>
                    <textarea id="profile-bio" rows="3" placeholder="请输入教师简介..." onchange="scheduleSave('profile')"></textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="settings-section" id="section-courses">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon green"><i class="fas fa-book"></i></div>
                <h2>我的课程</h2>
                <button class="btn btn-primary" style="margin-left: auto;" onclick="addCourse()"><i class="fas fa-plus"></i> 添加课程</button>
            </div>
            <div class="card-body">
                <div class="course-list" id="course-list-container">
                </div>
            </div>
        </div>
    </div>

    <div class="settings-section" id="section-students">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon orange"><i class="fas fa-users"></i></div>
                <h2>学生管理</h2>
            </div>
            <div class="card-body">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-students">0</div>
                        <div class="stat-label">学生总数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-attendance">0%</div>
                        <div class="stat-label">平均出勤率</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-average-score">0</div>
                        <div class="stat-label">平均成绩</div>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="viewAllStudents()">查看全部学生</button>
            </div>
        </div>
    </div>

    <div class="settings-section" id="section-notifications">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon purple"><i class="fas fa-bell"></i></div>
                <h2>通知设置</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>考试成绩通知</label>
                    <div class="toggle on" id="notif-exam-results" onclick="toggleToggle(this); scheduleSave('notifications')"></div>
                </div>
                <div class="form-group">
                    <label>学生缺勤提醒</label>
                    <div class="toggle on" id="notif-student-absence" onclick="toggleToggle(this); scheduleSave('notifications')"></div>
                </div>
                <div class="form-group">
                    <label>系统公告通知</label>
                    <div class="toggle on" id="notif-system" onclick="toggleToggle(this); scheduleSave('notifications')"></div>
                </div>
                <div class="form-group">
                    <label>邮件通知</label>
                    <div class="toggle" id="notif-email" onclick="toggleToggle(this); scheduleSave('notifications')"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="settings-section" id="section-security">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon orange"><i class="fas fa-key"></i></div>
                <h2>修改密码</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>当前密码</label>
                    <input type="password" id="security-current" placeholder="输入当前密码">
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="security-new" placeholder="输入新密码">
                </div>
                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" id="security-confirm" placeholder="确认新密码">
                </div>
                <button class="btn btn-primary" onclick="changePassword()">修改密码</button>
            </div>
        </div>
    </div>
</div>

<script>
    var saveTimers = {};
    var currentUser = {{ user | tojson | safe }};
    var coursesData = [];

    function showSection(sectionId) {
        document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.settings-section').forEach(s => s.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(sectionId).classList.add('active');
        
        if (sectionId === 'section-courses') loadCourses();
        if (sectionId === 'section-students') loadStudents();
    }

    function toggleToggle(el) {
        el.classList.toggle('on');
    }

    function scheduleSave(type) {
        if (saveTimers[type]) clearTimeout(saveTimers[type]);
        saveTimers[type] = setTimeout(function() {
            if (type === 'profile') saveProfile();
            else if (type === 'notifications') saveNotifications();
        }, 2000);
    }

    async function saveProfile() {
        var data = {
            email: document.getElementById('profile-email').value,
            phone: document.getElementById('profile-phone').value,
            bio: document.getElementById('profile-bio').value
        };
        
        try {
            var response = await fetch('/api/user/settings/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            var result = await response.json();
            if (result.success) {
                showToast('个人信息已保存', 'success');
            } else {
                showToast('保存失败: ' + (result.error || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('保存个人信息失败:', error);
            showToast('网络错误，保存失败', 'error');
        }
    }

    async function loadCourses() {
        try {
            var response = await fetch('/api/teacher/courses');
            var result = await response.json();
            
            if (result.success && result.data) {
                coursesData = result.data;
                renderCourses();
            }
        } catch (error) {
            console.error('加载课程列表失败:', error);
        }
    }

    function renderCourses() {
        var container = document.getElementById('course-list-container');
        if (!coursesData || coursesData.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px; color: #94a3b8;">暂无课程</div>';
            return;
        }
        
        var html = '';
        coursesData.forEach(function(course) {
            html += `
                <div class="course-item">
                    <div class="course-info">
                        <h4>${course.name}</h4>
                        <p>${course.academic_year || ''} · ${course.level || ''}</p>
                    </div>
                    <div>
                        <button class="btn btn-secondary btn-sm" onclick="editCourse(${course.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm" onclick="deleteCourse(${course.id})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    async function addCourse() {
        var courseName = prompt('请输入课程名称:');
        if (!courseName) return;
        
        var academicYear = prompt('请输入学年(如2026-2027):');
        var level = prompt('请输入课程级别(如本科一年级):');
        
        try {
            var response = await fetch('/api/teacher/courses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: courseName,
                    academic_year: academicYear,
                    level: level,
                    teacher_id: currentUser.id
                })
            });
            
            var result = await response.json();
            if (result.success) {
                showToast('课程添加成功', 'success');
                loadCourses();
            } else {
                showToast('添加失败: ' + (result.message || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('添加课程失败:', error);
            showToast('网络错误，添加失败', 'error');
        }
    }

    async function editCourse(courseId) {
        var course = coursesData.find(c => c.id === courseId);
        if (!course) return;
        
        var newName = prompt('请输入新的课程名称:', course.name);
        if (!newName) return;
        
        try {
            var response = await fetch('/api/teacher/courses/' + courseId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName })
            });
            
            var result = await response.json();
            if (result.success) {
                showToast('课程修改成功', 'success');
                loadCourses();
            } else {
                showToast('修改失败: ' + (result.message || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('修改课程失败:', error);
            showToast('网络错误，修改失败', 'error');
        }
    }

    async function deleteCourse(courseId) {
        if (!confirm('确认删除该课程？删除后无法恢复。')) return;
        
        try {
            var response = await fetch('/api/teacher/courses/' + courseId, {
                method: 'DELETE'
            });
            
            var result = await response.json();
            if (result.success) {
                showToast('课程删除成功', 'success');
                loadCourses();
            } else {
                showToast('删除失败: ' + (result.message || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('删除课程失败:', error);
            showToast('网络错误，删除失败', 'error');
        }
    }

    async function loadStudents() {
        try {
            var response = await fetch('/api/teacher/students');
            var result = await response.json();
            
            if (result.success && result.data) {
                document.getElementById('stat-students').textContent = result.data.length || '0';
                document.getElementById('stat-attendance').textContent = result.data.attendance_rate || '0%';
                document.getElementById('stat-average-score').textContent = result.data.average_score || '0';
            }
        } catch (error) {
            console.error('加载学生数据失败:', error);
        }
    }

    function viewAllStudents() {
        window.location.href = '/teacher/students';
    }

    async function saveNotifications() {
        var data = {
            exam_results: document.getElementById('notif-exam-results').classList.contains('on'),
            student_absence: document.getElementById('notif-student-absence').classList.contains('on'),
            system_announcements: document.getElementById('notif-system').classList.contains('on'),
            email_notifications: document.getElementById('notif-email').classList.contains('on')
        };
        
        try {
            var response = await fetch('/api/user/settings/notifications', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            var result = await response.json();
            if (result.success) {
                showToast('通知设置已保存', 'success');
            } else {
                showToast('保存失败: ' + (result.error || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('保存通知设置失败:', error);
            showToast('网络错误，保存失败', 'error');
        }
    }

    async function changePassword() {
        var current = document.getElementById('security-current').value;
        var newPassword = document.getElementById('security-new').value;
        var confirm = document.getElementById('security-confirm').value;
        
        if (!current || !newPassword || !confirm) {
            showToast('请填写所有密码字段', 'error');
            return;
        }
        
        if (newPassword !== confirm) {
            showToast('两次输入的新密码不一致', 'error');
            return;
        }
        
        if (newPassword.length < 6) {
            showToast('新密码长度至少为6位', 'error');
            return;
        }
        
        try {
            var response = await fetch('/api/user/change_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ current_password: current, new_password: newPassword })
            });
            
            var result = await response.json();
            if (result.success) {
                showToast('密码修改成功', 'success');
                document.getElementById('security-current').value = '';
                document.getElementById('security-new').value = '';
                document.getElementById('security-confirm').value = '';
            } else {
                showToast('修改失败: ' + (result.error || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('修改密码失败:', error);
            showToast('网络错误，修改失败', 'error');
        }
    }

    function showToast(message, type='info') {
        var existing = document.querySelector('.mtscos-toast');
        if (existing) existing.remove();
        
        var toast = document.createElement('div');
        toast.className = 'mtscos-toast';
        toast.style.cssText = `
            position: fixed; top: 80px; right: 20px; padding: 14px 24px; border-radius: 10px; 
            color: #fff; font-size: 14px; font-weight: 500; z-index: 9999;
            background: ${type === 'success' ? '#22c55e' : type === 'error' ? '#ef4444' : '#6366f1'};
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            animation: toastSlideIn 0.3s ease-out;
        `;
        toast.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle') + '" style="margin-right: 8px;"></i>' + message;
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadCourses();
        loadStudents();
    });
</script>
{% endblock %}
