<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI自我学习系统 - MTSCOS AI</title>
    <link rel="stylesheet" href="/assets/css/mtscos-design-system.css">
    <link rel="stylesheet" href="/assets/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="/assets/tailwind.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-dark: #0f0f23;
            --bg-card: rgba(30, 30, 60, 0.6);
            --border-color: rgba(99, 102, 241, 0.2);
        }
        
        body {
            background: var(--bg-dark);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            color: #c7d2fe;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: rgba(99, 102, 241, 0.5);
            color: white;
            transform: translateX(-4px);
        }
        
        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header-title {
            font-size: 36px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .header-subtitle {
            font-size: 16px;
            color: #94a3b8;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
        }
        
        .status-indicator.running {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .status-indicator.stopped {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        
        .status-indicator.running .status-dot {
            background: var(--success-color);
        }
        
        .status-indicator.stopped .status-dot {
            background: var(--danger-color);
            animation: none;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary-gradient);
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
        }
        
        .stat-icon {
            font-size: 36px;
            margin-bottom: 16px;
            opacity: 0.8;
        }
        
        .stat-value {
            font-size: 48px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #94a3b8;
        }
        
        .domains-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 40px;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .domain-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .domain-tag {
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .domain-tag:hover {
            background: rgba(99, 102, 241, 0.25);
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
        
        .domain-tag::before {
            content: '📚 ';
            margin-right: 5px;
        }
        
        .action-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
        }
        
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }
        
        .action-btn {
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .action-btn-primary {
            background: var(--primary-gradient);
            color: white;
        }
        
        .action-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4);
        }
        
        .action-btn-secondary {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        
        .action-btn-secondary:hover {
            background: rgba(148, 163, 184, 0.25);
            color: white;
            border-color: rgba(148, 163, 184, 0.5);
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 学习日志 */
        .learning-log {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 40px;
        }

        .log-container {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .log-container::-webkit-scrollbar {
            display: none;
        }

        .log-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .log-icon.learning { background: rgba(16, 185, 129, 0.15); color: var(--success-color); }
        .log-icon.discovery { background: rgba(99, 102, 241, 0.15); color: #c7d2fe; }
        .log-icon.error { background: rgba(239, 68, 68, 0.15); color: var(--danger-color); }
        .log-icon.insight { background: rgba(245, 158, 11, 0.15); color: var(--warning-color); }

        .log-content {
            flex: 1;
        }

        .log-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .log-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .log-time {
            font-size: 12px;
            color: #64748b;
        }

        /* 知识搜索 */
        .search-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 40px;
        }

        .search-input-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-results {
            display: grid;
            gap: 16px;
        }

        .search-result-item {
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border-left: 3px solid #6366f1;
            transition: all 0.3s;
        }

        .search-result-item:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: translateX(4px);
        }

        .result-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-category {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 4px;
            font-size: 11px;
            color: #c7d2fe;
            margin-bottom: 8px;
        }

        .result-content {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
            color: #94a3b8;
        }
        
        .last-updated {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .refresh-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .refresh-indicator i {
            animation: spin-refresh 1s linear infinite;
        }
        
        @keyframes spin-refresh {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            animation: slide-up 0.3s ease;
            display: none;
        }
        
        .toast-message.show {
            display: block;
        }
        
        .toast-success {
            background: rgba(16, 185, 129, 0.9);
            color: white;
        }
        
        .toast-error {
            background: rgba(239, 68, 68, 0.9);
            color: white;
        }
        
        .toast-info {
            background: rgba(99, 102, 241, 0.9);
            color: white;
        }
        
        @keyframes slide-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .progress-bar {
            height: 4px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 2px;
            transition: width 0.5s ease;
            animation: progress-flow 2s linear infinite;
        }
        
        @keyframes progress-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="nav-bar">
            <a href="/" class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                <span>返回首页</span>
            </a>
            <div style="flex: 1;"></div>
        </div>
        
        <div class="header-section">
            <h1 class="header-title">
                <i class="fas fa-brain"></i>
                AI自我学习系统
            </h1>
            <p class="header-subtitle">自动从网络学习知识，持续壮大脑库</p>
            <div id="status-indicator" class="status-indicator stopped">
                <span class="status-dot"></span>
                <span id="status-text">系统未启动</span>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-value" id="knowledge-count">0</div>
                <div class="stat-label">脑库知识总量</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="knowledge-progress" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-value" id="rule-count">0</div>
                <div class="stat-label">学习规则数量</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="rule-progress" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">🌐</div>
                <div class="stat-value" id="domain-count">0</div>
                <div class="stat-label">学习领域数量</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value" id="learning-cycle">--</div>
                <div class="stat-label">下次学习时间</div>
            </div>
        </div>
        
        <div class="domains-section">
            <h2 class="section-title">
                <i class="fas fa-tag"></i>
                学习领域
            </h2>
            <div id="domain-tags" class="domain-tags">
                <span style="color: #94a3b8;">加载中...</span>
            </div>
        </div>
        
        <div class="action-section">
            <h2 class="section-title">
                <i class="fas fa-play-circle"></i>
                操作控制
            </h2>
            <div class="action-buttons">
                <button class="action-btn action-btn-primary" id="btn-trigger" onclick="triggerLearning()">
                    <i class="fas fa-graduation-cap"></i>
                    手动触发学习
                </button>
                <button class="action-btn action-btn-secondary" id="btn-discover" onclick="discoverDirections()">
                    <i class="fas fa-search"></i>
                    发现学习方向
                </button>
                <button class="action-btn action-btn-secondary" id="btn-refresh" onclick="refreshStatus()">
                    <i class="fas fa-sync-alt"></i>
                    刷新状态
                </button>
                <button class="action-btn action-btn-secondary" id="btn-clear-log" onclick="clearLogs()">
                    <i class="fas fa-trash"></i>
                    清空日志
                </button>
            </div>
            
            <div class="info-row">
                <div class="last-updated">
                    <i class="fas fa-clock"></i>
                    <span>最后更新: <span id="last-updated">--</span></span>
                </div>
                <div class="refresh-indicator" id="refresh-indicator" style="display: none;">
                    <i class="fas fa-spinner"></i>
                    <span>刷新中...</span>
                </div>
            </div>
        </div>

        <div class="search-section">
            <h2 class="section-title">
                <i class="fas fa-search"></i>
                知识库搜索
            </h2>
            <div class="search-input-container">
                <input type="text" class="search-input" id="knowledge-search" placeholder="搜索知识库中的知识..." onkeypress="handleSearchKey(event)">
                <button class="action-btn action-btn-primary" onclick="searchKnowledge()">
                    <i class="fas fa-search"></i>
                    搜索
                </button>
            </div>
            <div id="search-results" class="search-results">
                <div style="text-align: center; color: #94a3b8; padding: 20px;">输入关键词搜索知识库</div>
            </div>
        </div>

        <div class="learning-log">
            <h2 class="section-title">
                <i class="fas fa-history"></i>
                学习日志
            </h2>
            <div class="log-container" id="learning-log-container">
                <div style="text-align: center; color: #94a3b8; padding: 20px;">加载学习日志中...</div>
            </div>
        </div>
    </div>
    
    <div id="toast-message" class="toast-message"></div>
    
    <script>
        var refreshInterval = null;
        
        function showToast(message, type = 'info') {
            var toast = document.getElementById('toast-message');
            toast.textContent = message;
            toast.className = 'toast-message toast-' + type + ' show';
            
            setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }
        
        function formatDateTime(dt) {
            var date = new Date(dt);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        function calculateNextLearningTime(lastUpdated) {
            var last = new Date(lastUpdated);
            var next = new Date(last.getTime() + 30 * 60 * 1000);
            var now = new Date();
            
            if (next > now) {
                var diff = Math.floor((next - now) / 1000);
                var minutes = Math.floor(diff / 60);
                var seconds = diff % 60;
                return minutes + '分' + seconds + '秒';
            } else {
                return '即将开始';
            }
        }
        
        function updateUI(data) {
            var status = data.status;
            
            var statusIndicator = document.getElementById('status-indicator');
            var statusText = document.getElementById('status-text');
            
            if (status.is_running) {
                statusIndicator.className = 'status-indicator running';
                statusText.textContent = '系统运行中';
            } else {
                statusIndicator.className = 'status-indicator stopped';
                statusText.textContent = '系统未启动';
            }
            
            document.getElementById('knowledge-count').textContent = status.knowledge_count;
            document.getElementById('rule-count').textContent = status.rule_count;
            document.getElementById('domain-count').textContent = (status.learning_domains || []).length;
            document.getElementById('last-updated').textContent = formatDateTime(status.last_updated);
            
            var knowledgeProgress = Math.min((status.knowledge_count / 1000) * 100, 100);
            var ruleProgress = Math.min((status.rule_count / 50) * 100, 100);
            
            document.getElementById('knowledge-progress').style.width = knowledgeProgress + '%';
            document.getElementById('rule-progress').style.width = ruleProgress + '%';
            
            document.getElementById('learning-cycle').textContent = calculateNextLearningTime(status.last_updated);
            
            var domainTags = document.getElementById('domain-tags');
            domainTags.innerHTML = '';
            
            if (status.learning_domains && status.learning_domains.length > 0) {
                status.learning_domains.forEach(function(domain) {
                    var tag = document.createElement('span');
                    tag.className = 'domain-tag';
                    tag.textContent = domain;
                    domainTags.appendChild(tag);
                });
            } else {
                domainTags.innerHTML = '<span style="color: #94a3b8;">暂无学习领域</span>';
            }
        }
        
        function refreshStatus() {
            var indicator = document.getElementById('refresh-indicator');
            indicator.style.display = 'flex';
            
            fetch('/api/ai_engine/self_learning/status')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function(data) {
                    if (data.success) {
                        updateUI(data);
                        showToast('状态刷新成功', 'success');
                    } else {
                        showToast('刷新失败: ' + data.error, 'error');
                    }
                })
                .catch(function(error) {
                    showToast('网络错误: ' + error.message, 'error');
                })
                .finally(function() {
                    indicator.style.display = 'none';
                });
        }
        
        function triggerLearning() {
            var btn = document.getElementById('btn-trigger');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 学习中...';
            
            fetch('/api/ai_engine/self_learning/trigger')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function(data) {
                    if (data.success) {
                        showToast('学习触发成功！新增 ' + data.learned_count + ' 条知识', 'success');
                        setTimeout(refreshStatus, 2000);
                    } else {
                        showToast('触发失败: ' + data.error, 'error');
                    }
                })
                .catch(function(error) {
                    showToast('网络错误: ' + error.message, 'error');
                })
                .finally(function() {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-graduation-cap"></i> 手动触发学习';
                });
        }
        
        function discoverDirections() {
            var btn = document.getElementById('btn-discover');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发现中...';
            
            fetch('/api/ai_engine/self_learning/discover')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function(data) {
                    if (data.success) {
                        var message = '发现了 ' + data.discovered_count + ' 个新学习方向';
                        if (data.new_rules && data.new_rules.length > 0) {
                            message += '，已添加到规则';
                        }
                        showToast(message, 'success');
                        setTimeout(refreshStatus, 2000);
                    } else {
                        showToast('发现失败: ' + data.error, 'error');
                    }
                })
                .catch(function(error) {
                    showToast('网络错误: ' + error.message, 'error');
                })
                .finally(function() {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-search"></i> 发现学习方向';
                });
        }
        
        function goBack() {
            event.preventDefault();
            if (history.length > 1) {
                history.back();
            } else {
                window.location.href = '/';
            }
        }
        
        function initAutoRefresh() {
            refreshInterval = setInterval(refreshStatus, 30000);
        }
        
        function handleSearchKey(event) {
            if (event.key === 'Enter') {
                searchKnowledge();
            }
        }

        function searchKnowledge() {
            var query = document.getElementById('knowledge-search').value.trim();
            if (!query) {
                showToast('请输入搜索关键词', 'error');
                return;
            }

            var resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> 搜索中...</div>';

            fetch('/api/ai_engine/knowledge/search?q=' + encodeURIComponent(query))
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function(data) {
                    if (data.results && data.results.length > 0) {
                        var html = '';
                        data.results.forEach(function(item) {
                            var categoryName = {
                                'technology': '技术知识',
                                'security': '安全知识',
                                'education': '教育知识',
                                'system': '系统知识',
                                'rule': '学习规则',
                                'other': '其他'
                            }[item.category] || item.category;

                            html += '<div class="search-result-item">' +
                                '<div class="result-title">' + (item.title || '未命名知识') + '</div>' +
                                '<span class="result-category">' + categoryName + '</span>' +
                                '<div class="result-content">' + (item.content || '').substring(0, 200) + (item.content && item.content.length > 200 ? '...' : '') + '</div>' +
                                '</div>';
                        });
                        resultsContainer.innerHTML = html;
                    } else {
                        resultsContainer.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;"><i class="fas fa-search"></i> 未找到相关知识</div>';
                    }
                })
                .catch(function(error) {
                    showToast('搜索失败: ' + error.message, 'error');
                    resultsContainer.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">搜索失败，请重试</div>';
                });
        }

        function loadLogs() {
            var container = document.getElementById('learning-log-container');
            container.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> 加载日志中...</div>';

            fetch('/api/ai_engine/self_learning/logs')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function(data) {
                    if (data.logs && data.logs.length > 0) {
                        var html = '';
                        data.logs.slice(0, 50).forEach(function(log) {
                            var iconClass = 'learning';
                            var icon = 'fa-book-open';
                            if (log.type === 'discovery') {
                                iconClass = 'discovery';
                                icon = 'fa-search';
                            } else if (log.type === 'error') {
                                iconClass = 'error';
                                icon = 'fa-exclamation-triangle';
                            } else if (log.type === 'insight') {
                                iconClass = 'insight';
                                icon = 'fa-lightbulb';
                            }

                            html += '<div class="log-item">' +
                                '<div class="log-icon ' + iconClass + '"><i class="fas ' + icon + '"></i></div>' +
                                '<div class="log-content">' +
                                '<div class="log-title">' + escapeHtml(log.title) + '</div>' +
                                '<div class="log-desc">' + escapeHtml(log.description || '') + '</div>' +
                                '<div class="log-time">' + formatDateTime(log.timestamp) + '</div>' +
                                '</div>' +
                                '</div>';
                        });
                        container.innerHTML = html;
                    } else {
                        container.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;"><i class="fas fa-history"></i> 暂无学习日志</div>';
                    }
                })
                .catch(function(error) {
                    console.error('加载日志失败:', error);
                    container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">加载日志失败</div>';
                });
        }

        function clearLogs() {
            if (!confirm('确定要清空学习日志吗？')) return;

            fetch('/api/ai_engine/self_learning/logs/clear', { method: 'POST' })
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function(data) {
                    if (data.success) {
                        showToast('日志清空成功', 'success');
                        loadLogs();
                    } else {
                        showToast('清空失败: ' + data.error, 'error');
                    }
                })
                .catch(function(error) {
                    showToast('清空失败: ' + error.message, 'error');
                });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;')
                       .replace(/"/g, '&quot;')
                       .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', function() {
            refreshStatus();
            loadLogs();
            initAutoRefresh();
        });
    </script>
</body>
</html>
