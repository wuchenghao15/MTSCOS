{% extends "base.html" %}

{% block title %}家长设置 - MTSCOS AI{% endblock %}

{% block head %}
<style>
    :root {
        --dark-bg-primary: #0c0c1e;
        --dark-bg-secondary: #1a1a3e;
        --dark-bg-card: rgba(20, 20, 40, 0.85);
        --dark-border: rgba(99, 102, 241, 0.2);
        --dark-text-primary: #ffffff;
        --dark-text-secondary: #94a3b8;
        --dark-primary-color: #6366f1;
        --dark-success: #22c55e;
        --dark-warning: #f59e0b;
    }
    
    body { background: linear-gradient(135deg, var(--dark-bg-primary) 0%, var(--dark-bg-secondary) 50%, var(--dark-bg-primary) 100%); min-height: 100vh; }
    .settings-wrap { max-width: 900px; margin: 30px auto; padding: 0 16px; }
    .settings-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .settings-header h1 { font-size: 24px; color: var(--dark-text-primary); margin: 0; }
    
    .settings-tabs { display: flex; gap: 8px; background: var(--dark-bg-card); border: 1px solid var(--dark-border); border-radius: 12px; padding: 6px; margin-bottom: 24px; flex-wrap: wrap; }
    .settings-tab { padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--dark-text-secondary); transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
    .settings-tab:hover { color: var(--dark-text-primary); background: rgba(0,0,0,0.2); }
    .settings-tab.active { background: linear-gradient(135deg, var(--dark-primary-color), #8b5cf6); color: #fff; }
    
    .settings-section { display: none; }
    .settings-section.active { display: block; }
    
    .settings-card { background: var(--dark-bg-card); border: 1px solid var(--dark-border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
    .card-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--dark-border); }
    .card-head h2 { font-size: 16px; color: var(--dark-text-primary); margin: 0; }
    .card-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .card-icon.blue { background: rgba(59,130,246,0.15); color: #6366f1; }
    .card-icon.orange { background: rgba(249,115,22,0.15); color: #f59e0b; }
    .card-icon.green { background: rgba(34,197,94,0.15); color: #22c55e; }
    .card-icon.purple { background: rgba(168,85,247,0.15); color: #a855f7; }
    
    .card-body { padding: 20px 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--dark-text-secondary); margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--dark-border); border-radius: 8px; background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; }
    
    .toggle { width: 44px; height: 24px; border-radius: 12px; background: #64748b; position: relative; cursor: pointer; transition: all 0.3s; display: inline-block; }
    .toggle::after { content: ''; width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; transition: all 0.3s; }
    .toggle.on { background: #6366f1; }
    .toggle.on::after { left: 22px; }
    
    .btn { padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }
    .btn-secondary { background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(99,102,241,0.2); }
    
    .kids-list { display: grid; gap: 12px; }
    .kid-item { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .kid-info h4 { color: #fff; margin: 0; }
    .kid-info p { color: #94a3b8; font-size: 12px; margin: 4px 0 0; }
    
    .progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .progress-card { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 16px; text-align: center; }
    .progress-value { font-size: 24px; font-weight: 700; color: #6366f1; }
    .progress-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
</style>
{% endblock %}

{% block content %}
<div class="settings-wrap">
    <div class="settings-header">
        <div class="card-icon blue"><i class="fas fa-user-circle"></i></div>
        <h1>家长设置</h1>
    </div>

    <div class="settings-tabs">
        <div class="settings-tab active" onclick="showSection('section-profile')"><i class="fas fa-user"></i> 个人信息</div>
        <div class="settings-tab" onclick="showSection('section-kids')"><i class="fas fa-children"></i> 孩子管理</div>
        <div class="settings-tab" onclick="showSection('section-progress')"><i class="fas fa-chart-line"></i> 学习进度</div>
        <div class="settings-tab" onclick="showSection('section-notifications')"><i class="fas fa-bell"></i> 通知设置</div>
        <div class="settings-tab" onclick="showSection('section-privacy')"><i class="fas fa-shield-alt"></i> 隐私设置</div>
        <div class="settings-tab" onclick="showSection('section-security')"><i class="fas fa-key"></i> 安全设置</div>
    </div>

    <div class="settings-section active" id="section-profile">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon blue"><i class="fas fa-user"></i></div>
                <h2>个人信息</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="profile-username" value="{{ user.username or '' }}" disabled>
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="profile-email" value="{{ user.email or '' }}" onchange="scheduleSave('profile')">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="profile-phone" value="{{ user.phone or '' }}" onchange="scheduleSave('profile')">
                </div>
            </div>
        </div>
    </div>

    <div class="settings-section" id="section-kids">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon orange"><i class="fas fa-children"></i></div>
                <h2>孩子管理</h2>
                <button class="btn btn-primary" style="margin-left: auto;" onclick="addKid()"><i class="fas fa-plus"></i> 添加孩子</button>
            </div>
            <div class="card-body">
                <div class="kids-list" id="kids-list-container">
                </div>
            </div>
        </div>
    </div>

    <div class="settings-section" id="section-progress">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon green"><i class="fas fa-chart-line"></i></div>
                <h2>孩子学习进度</h2>
            </div>
            <div class="card-body">
                <div class="progress-grid">
                    <div class="progress-card">
                        <div class="progress-value">85%</div>
                        <div class="progress-label">本周学习完成率</div>
                    </div>
                    <div class="progress-card">
                        <div class="progress-value">120</div>
                        <div class="progress-label">本周答题数</div>
                    </div>
                    <div class="progress-card">
                        <div class="progress-value">3</div>
                        <div class="progress-label">本周考试次数</div>
                    </div>
                    <div class="progress-card">
                        <div class="progress-value">88</div>
                        <div class="progress-label">平均分数</div>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="viewDetailedProgress()">查看详细报告</button>
            </div>
        </div>
    </div>

    <div class="settings-section" id="section-notifications">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon purple"><i class="fas fa-bell"></i></div>
                <h2>通知设置</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>孩子成绩通知</label>
                    <div class="toggle on" id="notif-kid-exam" onclick="toggleToggle(this); scheduleSave('notifications')"></div>
                </div>
                <div class="form-group">
                    <label>学习提醒</label>
                    <div class="toggle on" id="notif-kid-homework" onclick="toggleToggle(this); scheduleSave('notifications')"></div>
                </div>
                <div class="form-group">
                    <label>作业通知</label>
                    <div class="toggle on" id="notif-kid-attendance" onclick="toggleToggle(this); scheduleSave('notifications')"></div>
                </div>
                <div class="form-group">
                    <label>邮件通知</label>
                    <div class="toggle" id="notif-weekly-report" onclick="toggleToggle(this); scheduleSave('notifications')"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="settings-section" id="section-privacy">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon green"><i class="fas fa-shield-alt"></i></div>
                <h2>隐私设置</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>接收孩子学习报告</label>
                    <div class="toggle on" id="privacy-share-progress" onclick="toggleToggle(this); scheduleSave('privacy')"></div>
                </div>
                <div class="form-group">
                    <label>允许查看孩子详细成绩</label>
                    <div class="toggle on" id="privacy-receive-marketing" onclick="toggleToggle(this); scheduleSave('privacy')"></div>
                </div>
                <div class="form-group">
                    <label>数据收集</label>
                    <div class="toggle on" id="privacy-data-analytics" onclick="toggleToggle(this); scheduleSave('privacy')"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="settings-section" id="section-security">
        <div class="settings-card">
            <div class="card-head">
                <div class="card-icon orange"><i class="fas fa-key"></i></div>
                <h2>修改密码</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>当前密码</label>
                    <input type="password" id="security-current" placeholder="输入当前密码">
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="security-new" placeholder="输入新密码">
                </div>
                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" id="security-confirm" placeholder="确认新密码">
                </div>
                <button class="btn btn-primary" onclick="changePassword()">修改密码</button>
            </div>
        </div>
    </div>
</div>

<script>
    var saveTimers = {};
    var currentUser = {{ user | tojson | safe }};

    function showSection(sectionId) {
        document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.settings-section').forEach(s => s.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(sectionId).classList.add('active');
        
        if (sectionId === 'section-kids') loadKids();
    }

    function toggleToggle(el) {
        el.classList.toggle('on');
    }

    function scheduleSave(type) {
        if (saveTimers[type]) clearTimeout(saveTimers[type]);
        saveTimers[type] = setTimeout(function() {
            if (type === 'profile') saveProfile();
            else if (type === 'notifications') saveNotifications();
            else if (type === 'privacy') savePrivacy();
        }, 2000);
    }

    async function saveProfile() {
        var data = {
            email: document.getElementById('profile-email').value,
            phone: document.getElementById('profile-phone').value
        };
        
        try {
            var response = await fetch('/api/user/settings/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            var result = await response.json();
            if (result.success) {
                showToast('个人信息已保存', 'success');
            } else {
                showToast('保存失败: ' + (result.error || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('保存个人信息失败:', error);
            showToast('网络错误，保存失败', 'error');
        }
    }

    async function loadKids() {
        try {
            var response = await fetch('/api/parent/kids');
            var result = await response.json();
            
            if (result.success && result.data) {
                var container = document.getElementById('kids-list-container');
                if (result.data.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 40px; color: #94a3b8;">暂无关联孩子</div>';
                    return;
                }
                
                var html = '';
                result.data.forEach(function(kid) {
                    html += `
                        <div style="background: rgba(0,0,0,0.3); border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h4 style="color: #fff; margin: 0;">${kid.name}</h4>
                                <p style="color: #94a3b8; font-size: 12px; margin: 4px 0 0;">年级: ${kid.grade || '-'} | 教育类型: ${kid.education_type || '-'}</p>
                            </div>
                            <button class="btn btn-secondary btn-sm" onclick="viewKidProgress(${kid.id})"><i class="fas fa-chart-line"></i> 查看进度</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        } catch (error) {
            console.error('加载孩子列表失败:', error);
        }
    }

    async function addKid() {
        var kidName = prompt('请输入孩子姓名:');
        if (!kidName) return;
        
        var kidGrade = prompt('请输入孩子年级:');
        
        try {
            var response = await fetch('/api/parent/kids', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: kidName,
                    grade: kidGrade,
                    parent_id: currentUser.id
                })
            });
            var result = await response.json();
            if (result.success) {
                showToast('孩子添加成功', 'success');
                loadKids();
            } else {
                showToast('添加失败: ' + (result.message || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('添加孩子失败:', error);
            showToast('网络错误，添加失败', 'error');
        }
    }

    function viewKidProgress(kidId) {
        window.location.href = '/parent/kid_progress/' + kidId;
    }

    function viewDetailedProgress() {
        window.location.href = '/parent/detailed_report';
    }

    async function saveNotifications() {
        var data = {
            kid_exam: document.getElementById('notif-kid-exam').classList.contains('on'),
            kid_homework: document.getElementById('notif-kid-homework').classList.contains('on'),
            kid_attendance: document.getElementById('notif-kid-attendance').classList.contains('on'),
            weekly_report: document.getElementById('notif-weekly-report').classList.contains('on')
        };
        
        try {
            var response = await fetch('/api/user/settings/notifications', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            var result = await response.json();
            if (result.success) {
                showToast('通知设置已保存', 'success');
            } else {
                showToast('保存失败: ' + (result.error || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('保存通知设置失败:', error);
            showToast('网络错误，保存失败', 'error');
        }
    }

    async function savePrivacy() {
        var data = {
            share_progress: document.getElementById('privacy-share-progress').classList.contains('on'),
            receive_marketing: document.getElementById('privacy-receive-marketing').classList.contains('on'),
            data_analytics: document.getElementById('privacy-data-analytics').classList.contains('on')
        };
        
        try {
            var response = await fetch('/api/user/settings/privacy', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            var result = await response.json();
            if (result.success) {
                showToast('隐私设置已保存', 'success');
            } else {
                showToast('保存失败: ' + (result.error || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('保存隐私设置失败:', error);
            showToast('网络错误，保存失败', 'error');
        }
    }

    async function changePassword() {
        var current = document.getElementById('security-current').value;
        var newPassword = document.getElementById('security-new').value;
        var confirm = document.getElementById('security-confirm').value;
        
        if (!current || !newPassword || !confirm) {
            showToast('请填写所有密码字段', 'error');
            return;
        }
        
        if (newPassword !== confirm) {
            showToast('两次输入的新密码不一致', 'error');
            return;
        }
        
        if (newPassword.length < 6) {
            showToast('新密码长度至少为6位', 'error');
            return;
        }
        
        try {
            var response = await fetch('/api/user/change_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ current_password: current, new_password: newPassword })
            });
            var result = await response.json();
            if (result.success) {
                showToast('密码修改成功', 'success');
                document.getElementById('security-current').value = '';
                document.getElementById('security-new').value = '';
                document.getElementById('security-confirm').value = '';
            } else {
                showToast('修改失败: ' + (result.error || '未知错误'), 'error');
            }
        } catch (error) {
            console.error('修改密码失败:', error);
            showToast('网络错误，修改失败', 'error');
        }
    }

    function showToast(message, type='info') {
        var existing = document.querySelector('.mtscos-toast');
        if (existing) existing.remove();
        
        var toast = document.createElement('div');
        toast.className = 'mtscos-toast';
        toast.style.cssText = `
            position: fixed; top: 80px; right: 20px; padding: 14px 24px; border-radius: 10px; 
            color: #fff; font-size: 14px; font-weight: 500; z-index: 9999;
            background: ${type === 'success' ? '#22c55e' : type === 'error' ? '#ef4444' : '#6366f1'};
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            animation: toastSlideIn 0.3s ease-out;
        `;
        toast.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle') + '" style="margin-right: 8px;"></i>' + message;
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadKids();
    });
</script>
{% endblock %}
