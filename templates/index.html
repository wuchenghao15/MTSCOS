<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSCOS AI · MT架构 | 智能学习评估平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-light: #8b5cf6;
            --primary-accent: #a855f7;
            --primary-dark: #4f46e5;
            --bg-gradient-start: #050510;
            --bg-gradient-mid: #0c0c24;
            --bg-gradient-end: #070718;
            --card-bg: rgba(12, 12, 30, 0.7);
            --card-border: rgba(99, 102, 241, 0.18);
            --card-border-hover: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --text-accent: #a5b4fc;
            --glass-blur: 28px;
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 80px rgba(99, 102, 241, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.10) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 80%, rgba(79, 70, 229, 0.08) 0%, transparent 50%),
                        linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .aurora::before,
        .aurora::after {
            content: '';
            position: absolute;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: aurora-move 20s ease-in-out infinite alternate;
        }

        .aurora::before {
            background: radial-gradient(circle, var(--primary-color), transparent 70%);
            top: -20%;
            left: -10%;
        }

        .aurora::after {
            background: radial-gradient(circle, var(--primary-accent), transparent 70%);
            bottom: -20%;
            right: -10%;
            animation-delay: -10s;
        }

        @keyframes aurora-move {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5%, 3%) scale(1.05); }
            66% { transform: translate(-3%, 5%) scale(0.98); }
            100% { transform: translate(4%, -2%) scale(1.02); }
        }

        .main-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            animation: main-fade-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes main-fade-in {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .header-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-accent);
            margin-bottom: 20px;
            letter-spacing: 0.02em;
            animation: badge-slide 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }

        .brand-mark i {
            color: var(--primary-light);
            font-size: 11px;
        }

        @keyframes badge-slide {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            margin-bottom: 16px;
            animation: logo-drop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        @keyframes logo-drop {
            0% { opacity: 0; transform: scale(0.85) translateY(-10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .logo-icon {
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;
            border-radius: 26px;
            background: linear-gradient(145deg, var(--primary-color) 0%, var(--primary-light) 50%, var(--primary-accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: white;
            position: relative;
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.45),
                        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 30px;
            background: linear-gradient(145deg, var(--primary-color), var(--primary-accent));
            filter: blur(20px);
            opacity: 0.4;
            z-index: -1;
            animation: logo-pulse 3s ease-in-out infinite;
        }

        @keyframes logo-pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(1.08); }
        }

        .logo-icon i {
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
        }

        .brand-title {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 40%, #c7d2fe 70%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-subtitle {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
            margin-bottom: 4px;
        }

        .ai-hint {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-accent);
            opacity: 0.85;
            margin-top: 4px;
        }

        .ai-hint i {
            font-size: 10px;
            animation: ai-blink 1.8s ease-in-out infinite;
        }

        @keyframes ai-blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .time-section {
            text-align: center;
            margin-bottom: 32px;
            animation: time-fade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
        }

        @keyframes time-fade {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .time-display {
            font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
            font-size: 44px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-color) 50%, var(--primary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
        }

        .time-colon {
            display: inline-block;
            animation: colon-blink 1s steps(2) infinite;
        }

        @keyframes colon-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .date-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .date-display .divider {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--primary-color);
            opacity: 0.5;
        }

        .weekday-badge {
            padding: 2px 10px;
            border-radius: 100px;
            background: rgba(99, 102, 241, 0.12);
            color: var(--text-accent);
            font-weight: 600;
            font-size: 11px;
        }

        .login-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 38px;
            box-shadow: var(--glass-shadow);
            animation: card-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.6), transparent);
        }

        @keyframes card-rise {
            0% { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .login-card:hover {
            border-color: var(--card-border-hover);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.55), 0 0 100px rgba(99, 102, 241, 0.12);
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .card-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .card-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 7px;
            letter-spacing: 0.02em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            transition: color 0.25s;
            z-index: 1;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1px solid rgba(99, 102, 241, 0.12);
            border-radius: 12px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-primary);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(0, 0, 0, 0.32);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12),
                        0 0 24px rgba(99, 102, 241, 0.18);
        }

        .form-group input:focus + i,
        .form-group input:focus ~ i {
            color: var(--primary-light);
        }

        .form-group.has-error input {
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .form-group .error-text {
            color: #f87171;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .form-group.has-error .error-text {
            display: block;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 6px 0 22px;
        }

        .checkbox-wrapper {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-wrapper input {
            display: none;
        }

        .checkbox-custom {
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 1.5px solid rgba(99, 102, 241, 0.35);
            background: rgba(0, 0, 0, 0.2);
            margin-right: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .checkbox-wrapper input:checked + .checkbox-custom {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border-color: var(--primary-light);
        }

        .checkbox-custom i {
            font-size: 9px;
            color: white;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s;
        }

        .checkbox-wrapper input:checked + .checkbox-custom i {
            opacity: 1;
            transform: scale(1);
        }

        .checkbox-wrapper span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .link-forgot {
            font-size: 12px;
            color: var(--text-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .link-forgot:hover {
            color: var(--primary-light);
        }

        .btn-login {
            width: 100%;
            padding: 13px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 50%, var(--primary-accent) 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.45),
                        0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.55),
                        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-message {
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .login-message.error {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.25);
            display: block;
        }

        .login-message.success {
            background: rgba(34, 197, 94, 0.12);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.25);
            display: block;
        }

        .divider-row {
            display: flex;
            align-items: center;
            margin: 22px 0;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .divider-row::before,
        .divider-row::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.2), transparent);
        }

        .divider-row::before { margin-right: 14px; }
        .divider-row::after { margin-left: 14px; }

        .btn-register {
            width: 100%;
            padding: 12px 24px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s;
            background: rgba(99, 102, 241, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-primary);
        }

        .btn-register:hover {
            background: rgba(99, 102, 241, 0.14);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: -4px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-section {
            text-align: center;
            margin-top: 30px;
            animation: footer-fade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        @keyframes footer-fade {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .version-row {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 7px 16px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }

        .version-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .version-item i { font-size: 10px; }

        .version-tag {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 5px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--text-accent);
            font-weight: 700;
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 0.02em;
        }

        .mt-tag {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(99, 102, 241, 0.2));
            color: #ddd6fe;
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .copyright {
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
            .brand-title { font-size: 32px; }
            .time-display { font-size: 36px; }
            .logo-icon { width: 72px; height: 72px; font-size: 32px; border-radius: 22px; }
        }
    </style>
</head>
<body>
    <div class="aurora"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="main-wrapper">
        <div class="header-section">
            <div class="brand-mark">
                <i class="fas fa-cube"></i>
                <span>MT ARCHITECTURE v1.0</span>
            </div>

            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <h1 class="brand-title">MTSCOS AI</h1>
                <p class="brand-subtitle">智能学习评估平台 · AI驱动教育未来</p>
                <div class="ai-hint">
                    <i class="fas fa-circle"></i>
                    <span>AI Self-Learning System Active · 206 Rules Enforced</span>
                </div>
            </div>
        </div>

        <div class="time-section">
            <div class="time-display" id="clock-display">
                <span id="time-h">00</span><span class="time-colon">:</span><span id="time-m">00</span><span class="time-colon">:</span><span id="time-s">00</span>
            </div>
            <div class="date-display">
                <span id="date-text">加载中...</span>
                <span class="divider"></span>
                <span class="weekday-badge" id="weekday-text">--</span>
            </div>
        </div>

        <div class="login-card">
            <div class="card-header">
                <h2>欢迎回来</h2>
                <p>登录以开启您的AI学习之旅</p>
            </div>

            <div class="login-message" id="login-message"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group" id="username-group">
                    <label for="login-username">用户名</label>
                    <div class="input-wrapper">
                        <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
                        <i class="fas fa-user"></i>
                    </div>
                    <span class="error-text" id="username-error"></span>
                </div>

                <div class="form-group" id="password-group">
                    <label for="login-password">密码</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
                        <i class="fas fa-lock"></i>
                    </div>
                    <span class="error-text" id="password-error"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember-me">
                        <span class="checkbox-custom"><i class="fas fa-check"></i></span>
                        <span>记住我</span>
                    </label>
                    <a href="/auth/forgot_password" class="link-forgot">忘记密码？</a>
                </div>

                <button type="submit" class="btn-login" id="login-btn">
                    <span id="login-btn-text">登 录</span>
                </button>
            </form>

            <div class="divider-row">或</div>

            <button class="btn-register" onclick="window.location.href='/auth/register'">
                创 建 新 账 户
            </button>
        </div>

        <div class="footer-section">
            <div class="version-row">
                <span class="version-item">
                    <i class="fas fa-layer-group"></i>
                    <span>MT架构</span>
                    <span class="version-tag mt-tag">v1.0</span>
                </span>
                <span class="version-item">
                    <i class="fas fa-code-branch"></i>
                    <span>系统版本</span>
                    <span class="version-tag" id="sys-version">v{{ version }}</span>
                </span>
            </div>
            <div class="copyright">
                &copy; 2026 MTSCOS AI · All Rights Reserved · Powered by MT Architecture
            </div>
        </div>
    </div>

    <script>
        (function initParticles() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            const PARTICLE_COUNT = Math.min(90, Math.floor(window.innerWidth / 12));
            const MAX_DISTANCE = 130;

            function resize() {
                width = canvas.width = window.innerWidth * window.devicePixelRatio;
                height = canvas.height = window.innerHeight * window.devicePixelRatio;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            resize();
            window.addEventListener('resize', resize);

            class Particle {
                constructor() {
                    this.reset(true);
                }
                reset(initial) {
                    this.x = Math.random() * window.innerWidth;
                    this.y = Math.random() * window.innerHeight;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.radius = Math.random() * 1.8 + 0.7;
                    const colors = ['rgba(99, 102, 241, ', 'rgba(139, 92, 246, ', 'rgba(168, 85, 247, ', 'rgba(192, 132, 252, '];
                    this.colorBase = colors[Math.floor(Math.random() * colors.length)];
                    this.alpha = initial ? Math.random() * 0.5 + 0.2 : 0;
                    this.targetAlpha = Math.random() * 0.5 + 0.25;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.alpha < this.targetAlpha) this.alpha += 0.004;
                    if (this.x < 0 || this.x > window.innerWidth) this.vx *= -1;
                    if (this.y < 0 || this.y > window.innerHeight) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.colorBase + this.alpha + ')';
                    ctx.fill();
                    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 4);
                    glow.addColorStop(0, this.colorBase + (this.alpha * 0.4) + ')');
                    glow.addColorStop(1, this.colorBase + '0)');
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
                    ctx.fillStyle = glow;
                    ctx.fill();
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

            function drawConnections() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < MAX_DISTANCE) {
                            const opacity = (1 - dist / MAX_DISTANCE) * 0.25;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = 'rgba(139, 92, 246, ' + opacity + ')';
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
            }

            let mouseX = -1000, mouseY = -1000;
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function drawMouseConnections() {
                if (mouseX < 0) return;
                for (let i = 0; i < particles.length; i++) {
                    const dx = particles[i].x - mouseX;
                    const dy = particles[i].y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MAX_DISTANCE * 1.2) {
                        const opacity = (1 - dist / (MAX_DISTANCE * 1.2)) * 0.35;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouseX, mouseY);
                        ctx.strokeStyle = 'rgba(168, 85, 247, ' + opacity + ')';
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                particles.forEach(p => { p.update(); p.draw(); });
                drawConnections();
                drawMouseConnections();
                requestAnimationFrame(animate);
            }
            animate();
        })();

        (function updateClock() {
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            function update() {
                const now = new Date();
                const pad = n => n.toString().padStart(2, '0');
                document.getElementById('time-h').textContent = pad(now.getHours());
                document.getElementById('time-m').textContent = pad(now.getMinutes());
                document.getElementById('time-s').textContent = pad(now.getSeconds());
                document.getElementById('date-text').textContent =
                    now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日';
                document.getElementById('weekday-text').textContent = weekdays[now.getDay()];
            }
            update();
            setInterval(update, 1000);
        })();

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const remember = document.getElementById('remember-me').checked;
            const loginBtn = document.getElementById('login-btn');
            const loginBtnText = document.getElementById('login-btn-text');
            const messageEl = document.getElementById('login-message');

            clearErrors();

            if (!username) { showError('username', '请输入用户名'); return; }
            if (!password) { showError('password', '请输入密码'); return; }

            loginBtn.disabled = true;
            loginBtnText.innerHTML = '<span class="spinner"></span>登录中...';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ username, password, remember_me: remember })
                });
                const data = await response.json();

                if (data.success) {
                    messageEl.className = 'login-message success';
                    messageEl.textContent = '登录成功，正在跳转...';
                    if (data.user && data.user.username === 'wuchenghao15') {
                        localStorage.setItem('mtscos_super_admin_hidden', 'true');
                    }
                    setTimeout(() => { window.location.href = data.redirect || '/dashboard'; }, 500);
                } else {
                    messageEl.className = 'login-message error';
                    messageEl.textContent = data.message || '登录失败';
                    loginBtn.disabled = false;
                    loginBtnText.textContent = '登 录';
                }
            } catch (error) {
                messageEl.className = 'login-message error';
                messageEl.textContent = '网络错误，请稍后重试';
                loginBtn.disabled = false;
                loginBtnText.textContent = '登 录';
            }
        }

        function showError(field, message) {
            const group = document.getElementById(field + '-group');
            const errorEl = document.getElementById(field + '-error');
            if (group && errorEl) {
                group.classList.add('has-error');
                errorEl.textContent = message;
            }
        }

        function clearErrors() {
            document.querySelectorAll('.form-group').forEach(g => g.classList.remove('has-error'));
            const msg = document.getElementById('login-message');
            msg.className = 'login-message';
            msg.textContent = '';
        }

        document.getElementById('login-username').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById('login-password').focus();
        });
    </script>
