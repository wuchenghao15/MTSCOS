<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="32" height="32" role="img" aria-label="MTSCOS AI Logo">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bgGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="bg"/>
      <feColorMatrix in="bg" type="matrix"
        values="0.39 0    0    0    0.39
                0    0.40 0    0    0.40
                0    0    0.95 0    0.95
                0    0    0    0.35 0"/>
    </filter>
  </defs>

  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#brandGradient)" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#brandGradient)" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Soft glow background -->
  <g filter="url(#bgGlow)">
    <circle cx="256" cy="256" r="150" fill="#6366f1"/>
  </g>

  <!-- AI Neural nodes orbit -->
  <g stroke="#c4b5fd" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="156" stroke-dasharray="2 6"/>
  </g>

  <g fill="#a5b4fc">
    <circle cx="256" cy="76" r="6"/>
    <circle cx="436" cy="256" r="6"/>
    <circle cx="256" cy="436" r="6"/>
    <circle cx="76" cy="256" r="6"/>
    <circle cx="384" cy="128" r="4.5"/>
    <circle cx="128" cy="384" r="4.5"/>
    <circle cx="384" cy="384" r="4.5"/>
    <circle cx="128" cy="128" r="4.5"/>
  </g>

  <!-- Neural connector lines -->
  <g stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1">
    <line x1="256" y1="76" x2="436" y2="256"/>
    <line x1="436" y1="256" x2="256" y2="436"/>
    <line x1="256" y1="436" x2="76" y2="256"/>
    <line x1="76" y1="256" x2="256" y2="76"/>
    <line x1="384" y1="128" x2="128" y2="384"/>
    <line x1="128" y1="128" x2="384" y2="384"/>
  </g>

  <!-- MT Cube core (3D isometric) -->
  <g filter="url(#softGlow)" transform="translate(256 256)">
    <g>
      <!-- top face -->
      <polygon points="0,-80 70,-40 0,0 -70,-40" fill="#e9d5ff"/>
      <!-- left face -->
      <polygon points="-70,-40 0,0 0,80 -70,40" fill="url(#cubeGradient)"/>
      <!-- right face -->
      <polygon points="70,-40 0,0 0,80 70,40" fill="#6366f1"/>
      <!-- cube edges -->
      <polyline points="0,-80 70,-40 70,40 0,80 -70,40 -70,-40 0,-80 0,0"
                fill="none" stroke="#f5f3ff" stroke-width="1.6" stroke-linejoin="round" stroke-opacity="0.95"/>
      <line x1="70" y1="-40" x2="0" y2="0" stroke="#f5f3ff" stroke-width="1.6" stroke-opacity="0.9"/>
      <line x1="-70" y1="-40" x2="0" y2="0" stroke="#f5f3ff" stroke-width="1.6" stroke-opacity="0.9"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#f5f3ff" stroke-width="1.6" stroke-opacity="0.9"/>

      <!-- Brain/AI icon overlay (neural dot matrix inside cube) -->
      <g fill="#f8fafc">
        <circle cx="-26" cy="-8" r="3"/>
        <circle cx="0" cy="-22" r="3"/>
        <circle cx="26" cy="-8" r="3"/>
        <circle cx="-18" cy="16" r="3"/>
        <circle cx="18" cy="16" r="3"/>
        <circle cx="0" cy="46" r="3"/>
      </g>
      <g stroke="#c7d2fe" stroke-width="1.2" fill="none" stroke-opacity="0.9">
        <line x1="-26" y1="-8" x2="0" y2="-22"/>
        <line x1="0" y1="-22" x2="26" y2="-8"/>
        <line x1="-26" y1="-8" x2="-18" y2="16"/>
        <line x1="26" y1="-8" x2="18" y2="16"/>
        <line x1="-18" y1="16" x2="18" y2="16"/>
        <line x1="-18" y1="16" x2="0" y2="46"/>
        <line x1="18" y1="16" x2="0" y2="46"/>
      </g>

      <!-- MT letters engraving -->
      <g transform="translate(0 26)" font-family="'SF Pro Display','PingFang SC','Microsoft YaHei',sans-serif"
         font-weight="800" fill="#f5f3ff" fill-opacity="0.95"
         style="paint-order:stroke;stroke:rgba(79,70,229,0.25);stroke-width:1;">
        <text x="-22" y="0" text-anchor="middle" font-size="16">M</text>
        <text x="22" y="0" text-anchor="middle" font-size="16">T</text>
      </g>
    </g>
  </g>

  <!-- Brand wordmark -->
  <g transform="translate(256 456)" text-anchor="middle"
     font-family="'SF Pro Display','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="0" y="0" font-size="42" font-weight="800" letter-spacing="-1" fill="url(#brandGradient)">MTSCOS</text>
    <text x="0" y="28" font-size="18" font-weight="700" letter-spacing="6" fill="#a5b4fc">AI · MT</text>
  </g>
</svg>
