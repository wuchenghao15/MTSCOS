<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>古灵阁证券交易系统（实盘） · Celadon Terminal</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/css/mtscos_design_tokens.css">
<link rel="stylesheet" href="/static/css/iceberg.css">
<link rel="stylesheet" href="/static/css/andromeda-ice-theme.css">
<script src="/static/echarts.min.js"></script>
<script src="/static/i18n/i18n.js" defer></script>
<script src="/static/js/andromeda_nav.js" defer></script>
<style>
/* ═══════════════════════════════════════════════════════════
   古灵阁证券交易系统（实盘） v3.0 · Professional Trading Terminal
   Bloomberg Terminal × 青瓷黑 × 等宽专业终端
   ═══════════════════════════════════════════════════════════ */

@font-face{font-family:'JetBrains Mono';src:local('JetBrains Mono'),local('Menlo'),local('SF Mono');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:clip;background:var(--bg-0);color:var(--ink-0);font-family:var(--ice-font-cn,serif);-webkit-font-smoothing:antialiased;font-size:12.5px;line-height:1.4}

/* ─── Design Tokens (桥接冰山 --ice-* + Andromeda --andromeda-* 体系, 保留青瓷品牌色) ─── */
:root{
  /* ── 青瓷品牌身份 + 实盘专属 (保留) ── */
  --gold:#c9a84c; --ink-700:#AEC7D8;
  --bg-5:#1a2332; --bg-6:#2a3a4f;
  --accent-red:#991b1b; --accent-red-2:var(--ice-accent, #ff3b3b);
  --accent-white:#ffffff;
  --celadon:#5B8FB9;--celadon-bright:#8CCBE4;--celadon-dim:#3D6B8A;
  --plum:#6FA88B;--obsidian:#C9A961;--obsidian-bright:#E8C87C;
  --gold-line:var(--ice-divider-gold, #ffd700);

  /* ── 语义色 → 冰山主题 (跟随 data-theme="dark") ── */
  --bg-0:var(--ice-bg-page, #050d18);
  --bg-1:var(--ice-bg-card, #0f1a28);
  --bg-2:var(--ice-secondary, #0a1628);
  --bg-3:var(--ice-secondary-dark, #050d18);
  --bg-4:var(--ice-ink-line, #1e2d3d);
  --line:var(--ice-ink-line, #1e2d3d);
  --line-strong:var(--ice-bg-card, #0f1a28);

  /* ── 涨跌色 (冰山: red=accent, green=primary) ── */
  --up:var(--ice-accent, #ff3b3b);
  --up-soft:color-mix(in srgb,var(--ice-accent, #ff3b3b) 18%,transparent);
  --down:var(--ice-primary, #00d4aa);
  --down-soft:color-mix(in srgb,var(--ice-primary, #00d4aa) 18%,transparent);
  --danger:var(--ice-accent, #ff3b3b);
  --success:var(--ice-primary, #00d4aa);
  --warning:var(--accent-amber, #e6a23c);

  /* ── 文字色阶 → 冰山 ink 体系 ── */
  --ink-0:var(--ice-ink, #e0e8f0);
  --ink-1:var(--ice-ink, #e0e8f0);
  --ink-90:var(--ice-ink, #e0e8f0);
  --ink-70:var(--ice-ink-soft, #a0b0c0);
  --ink-50:var(--ice-ink-muted, #607080);
  --ink-30:var(--ice-ink-muted, #607080);
  --ink-20:var(--ice-ink-line, #1e2d3d);

  --mono:var(--ice-font-mono, "JetBrains Mono","SF Mono",Menlo,monospace);
}

/* ═══ 顶栏 HEADER ═══ */
.hdr{height:48px;background:var(--bg-1);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:0 16px;gap:20px}
.hdr .brand{display:flex;align-items:center;gap:10px}
.hdr .brand .logo{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--obsidian),var(--celadon));display:flex;align-items:center;justify-content:center;font-size:14px}
.hdr .brand .name{font-weight:700;font-size:14px;letter-spacing:1px}
.hdr .brand .sub{font-family:var(--mono);font-size:10px;color:var(--ink-50);margin-left:4px}
.hdr .center{display:flex;align-items:center;gap:18px}
.hdr .ticker{font-family:var(--mono);font-size:11px;color:var(--ink-50)}
.hdr .phase{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);color:var(--celadon-bright)}
.hdr .phase.auction{color:var(--obsidian-bright);border-color:rgba(201,169,97,.4)}
.hdr .phase.close{color:var(--ink-50)}
.hdr .right{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--ink-70)}
.hdr .dot{width:7px;height:7px;border-radius:50%;background:var(--celadon);box-shadow:0 0 8px var(--celadon);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══ 主体 GRID ═══ */
.stage{height:calc(100dvh - 48px);display:grid;grid-template-columns:260px 1fr 280px;gap:0;overflow:auto}
/* 仙女座统一导航注入后: 左侧 200px + 底部 70px 让位 */
.andromeda-has-nav .stage{height:calc(100dvh - 118px)}
.stage > *{min-height:0}
/*  消除所有滚动条: panel 内容用 flex 收缩, 不滚动 */
.stage > *::-webkit-scrollbar{display:none}
.stage > *{scrollbar-width:none}

/* 栏分隔线 */
.col-left{border-right:1px solid var(--line)}
.col-right{border-left:1px solid var(--line)}

/* ═══ Panel 统一 ═══ */
.panel{border-bottom:1px solid var(--line)}
.panel:last-child{border-bottom:none}
.panel-head{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg-1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.panel-head .ph-title{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--ink-700);text-transform:uppercase}
.panel-head .ph-dot{width:5px;height:5px;border-radius:50%;background:var(--celadon)}
.panel-head .ph-right{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-50)}
.panel-body{padding:6px 10px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-0) transparent}

/* ═══ 左栏 · 账户 ═══ */
.acct-kpi{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-bottom:1px}
.acct-kpi .k{background:var(--bg-2);padding:10px 12px}
.acct-kpi .k .label{font-size:10px;color:var(--ink-50);letter-spacing:1px}
.acct-kpi .k .val{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:2px;color:var(--ink-90)}
.acct-kpi .k .v{font-family:var(--mono);font-size:16px;font-weight:700;margin-top:2px}
.acct-kpi .k.up .v{color:var(--up)}
.acct-kpi .k.down .v{color:var(--down)}
.acct-kpi .k.gold .val{color:var(--obsidian-bright)}

/* 风险集中度 */
.conc-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px}
.conc-row .name{width:62px;color:var(--ink-70);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conc-row .bar{flex:1;height:6px;background:var(--bg-3);border-radius:3px;overflow:hidden}
.conc-row .bar i{display:block;height:100%;border-radius:3px;transition:width .6s}
.conc-row .bar.top1 i{background:var(--up)}
.conc-row .bar.top2 i{background:var(--obsidian)}
.conc-row .bar.top3 i{background:var(--celadon)}
.conc-row .bar.other i{background:var(--celadon-dim)}
.conc-row .pct{width:36px;text-align:right;font-family:var(--mono);color:var(--ink-50);font-size:10px}

/* HHI 指标条 */
.hhi-bar{display:flex;gap:1px;background:var(--line);margin:6px 0}
.hhi-bar .h{background:var(--bg-2);flex:1;padding:6px 8px;text-align:center}
.hhi-bar .h .lk{font-size:9px;color:var(--ink-50);letter-spacing:1px}
.hhi-bar .h .lv{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-90)}
.hhi-bar .h.hi .lv{color:var(--up)}

/* ═══ 中栏 · K 线 + 持仓 + 事件 ═══ */
.chart-area{background:var(--bg-0)}
.chart-host{height:260px;width:100%}
.chart-legend{display:flex;gap:12px;padding:4px 10px;background:var(--bg-1);font-family:var(--mono);font-size:10px;color:var(--ink-50)}
.chart-legend .cl{display:flex;align-items:center;gap:5px}
.chart-legend .cl i{width:8px;height:2px;border-radius:1px}

/* 持仓表 */
.pos-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
.pos-table th{text-align:right;font-weight:500;font-size:10px;color:var(--ink-50);letter-spacing:1px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg-1)}
.pos-table th:first-child{text-align:left}
.pos-table td{padding:8px;border-bottom:1px solid var(--line);color:var(--ink-90);text-align:right}
.pos-table td:first-child{text-align:left;font-family:'PingFang SC',sans-serif}
.pos-table tr:hover td{background:rgba(91,143,185,.06)}
.pos-table td.up{color:var(--up)}
.pos-table td.down{color:var(--down)}
.pos-table .sym{color:var(--ink-50);font-size:10px;margin-left:4px}
.pos-table .ma{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;margin-left:2px;background:var(--bg-3);color:var(--ink-50);font-family:var(--mono)}
.pos-table .ma.ma5{color:var(--obsidian-bright);border-color:rgba(201,169,97,.3)}
.pos-table .ma.ma10{color:var(--celadon-bright)}
.pos-table .ma.ma20{color:var(--plum)}

/* ═══ 中右 · 事件流 ═══ */
.ev-list{display:flex;flex-direction:column;gap:1px}
.ev{display:grid;grid-template-columns:46px 48px 1fr;gap:6px;padding:4px 6px;background:var(--bg-2);border-radius:3px;cursor:pointer;transition:background .15s}
.ev:hover{background:var(--bg-3)}
.ev .et{font-family:var(--mono);font-size:10px;color:var(--ink-50)}
.ev .el{font-size:10px;font-weight:600;text-align:center;border-radius:3px;padding:2px 0;letter-spacing:.5px}
.ev .em{font-size:11px;color:var(--ink-70);line-height:1.5}
.ev .up{color:var(--up);background:var(--up-soft)}
.ev .down{color:var(--down);background:var(--down-soft)}
.ev .info{color:var(--celadon-bright);background:rgba(91,143,185,.15)}
.ev .warn{color:var(--obsidian-bright);background:rgba(201,169,97,.15)}
.ev .sys{color:var(--ink-50);background:rgba(107,138,164,.12)}

/* ═══ 右栏 · AI 军团 ═══ */
/* AI 军团 · 金牌金融团队 */
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ai-card{background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:7px 8px;position:relative;overflow:hidden}
.ai-card::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:var(--celadon);opacity:.4}
.ai-card.tier-gold::before{background:linear-gradient(var(--obsidian),var(--obsidian-bright));opacity:1}
.ai-card.tier-super::before{background:linear-gradient(var(--celadon-bright),var(--ink-1));opacity:.8}
.ai-card.tier-expert::before{background:linear-gradient(var(--plum),var(--obsidian));opacity:.8}
.ai-card.off::before{background:var(--up);opacity:.5}
.ai-card .ai-h{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.ai-card .ai-d{width:6px;height:6px;border-radius:50%;background:var(--celadon)}
.ai-card .ai-n{font-size:11px;font-weight:700;color:var(--ink-90)}
.ai-card .ai-tier{font-size:7px;padding:1px 4px;border-radius:2px;margin-left:auto;font-family:var(--mono);letter-spacing:.5px;font-weight:700}
.ai-card .ai-tier.gold{background:rgba(201,169,97,.25);color:var(--obsidian-bright);border:1px solid rgba(201,169,97,.4)}
.ai-card .ai-tier.super{background:rgba(140,203,228,.2);color:var(--celadon-bright);border:1px solid rgba(140,203,228,.35)}
.ai-card .ai-tier.expert{background:rgba(111,168,139,.2);color:var(--plum);border:1px solid rgba(111,168,139,.4)}
.ai-card .ai-desc{font-size:9px;color:var(--ink-50);line-height:1.35;margin-bottom:2px;letter-spacing:.2px}
.ai-card .ai-r{font-size:10px;color:var(--ink-50)}
.ai-card .ai-exp{font-family:var(--mono);font-size:8px;color:var(--obsidian);letter-spacing:.3px}
.ai-card .ai-b{height:3px;background:var(--bg-3);border-radius:2px;overflow:hidden;margin-top:3px}
.ai-card .ai-b i{display:block;height:100%;background:var(--celadon);border-radius:2px}
.ai-card.off .ai-d{background:var(--up)}
.ai-card.off .ai-n{color:var(--ink-50)}
.ai-card.off .ai-tier{opacity:.4}

/* 异动雷达 */
.rd-row{display:grid;grid-template-columns:1fr 56px 40px 46px;gap:6px;padding:5px 8px;font-size:11px;align-items:center;border-bottom:1px solid var(--line)}
.rd-row:last-child{border-bottom:none}
.rd-row .rd-n{color:var(--ink-90)}
.rd-row .rd-n .sym{color:var(--ink-50);font-family:var(--mono);font-size:10px;margin-left:4px}
.rd-row .rd-p{font-family:var(--mono);color:var(--ink-90)}
.rd-row.up .rd-p{color:var(--up)}
.rd-row.down .rd-p{color:var(--down)}
.rd-row .rd-c{font-family:var(--mono);font-size:10px;color:var(--ink-50)}
.rd-row .rd-s{font-family:var(--mono);font-size:9px;padding:2px 4px;border-radius:2px;text-align:center}
.rd-row .rd-s.long{color:var(--up);background:var(--up-soft)}
.rd-row .rd-s.short{color:var(--down);background:var(--down-soft)}
.rd-row .rd-s.side{color:var(--ink-50);background:var(--bg-3)}

/* 操盘流水 */
.tr-row{display:grid;grid-template-columns:52px 34px 1fr;gap:6px;padding:5px 8px;font-size:11px;border-bottom:1px solid var(--line)}
.tr-row:last-child{border-bottom:none}
.tr-row .tr-t{font-family:var(--mono);font-size:10px;color:var(--ink-50)}
.tr-row .tr-a{font-size:10px;font-weight:700;text-align:center;border-radius:3px;padding:1px 0;letter-spacing:.5px}
.tr-row .tr-a.buy{color:var(--up);background:var(--up-soft)}
.tr-row .tr-a.sell{color:var(--down);background:var(--down-soft)}
.tr-row .tr-d{color:var(--ink-70);font-size:11px}
.tr-row .tr-d .tr-sub{font-family:var(--mono);font-size:10px;color:var(--ink-50);margin-top:2px}

/* 董事会决策 */
.dc-row{padding:6px 8px;font-size:11px;border-bottom:1px solid var(--line);cursor:pointer}
.dc-row:last-child{border-bottom:none}
.dc-row:hover{background:var(--bg-3)}
.dc-row .dc-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.dc-row .dc-act{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;letter-spacing:.5px}
.dc-row .dc-act.buy{color:var(--up);background:var(--up-soft)}
.dc-row .dc-act.sell{color:var(--down);background:var(--down-soft)}
.dc-row .dc-act.hold{color:var(--celadon-bright);background:rgba(91,143,185,.15)}
.dc-row .dc-act.skip{color:var(--ink-50);background:var(--bg-3)}
.dc-row .dc-sym{color:var(--ink-90);font-weight:600}
.dc-row .dc-reason{color:var(--ink-70);font-size:11px;line-height:1.5}
.dc-row details{margin-top:4px}
.dc-row details summary{cursor:pointer;color:var(--obsidian-bright);font-size:10px;list-style:none}
.dc-row details summary::-webkit-details-marker{display:none}
.dc-row details::before{content:'▸';color:var(--obsidian-bright);font-size:10px}
.dc-row details[open]::before{content:'▾'}

/* 引擎心跳 */
.eng-row{display:flex;align-items:center;gap:6px;padding:3px 8px;font-family:var(--mono);font-size:10px}
.eng-row .eng-d{width:6px;height:6px;border-radius:50%;background:var(--celadon)}
.eng-row .eng-d.off{background:var(--up)}
.eng-row .eng-n{color:var(--ink-70);flex:1}
.eng-row .eng-v{color:var(--ink-50)}

/* 按钮 */
.btn{font-family:var(--mono);font-size:10px;font-weight:600;padding:5px 10px;border-radius:4px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink-70);cursor:pointer;letter-spacing:.5px;transition:all .15s}
.btn:hover{background:var(--bg-3);color:var(--ink-90);border-color:var(--celadon-dim)}
.btn.primary{border-color:var(--celadon);color:var(--celadon-bright)}

/* 板块标题滚动条 */
/* 栏内 panel 全部 flex-shrink:1 + overflow:hidden — 让内容紧凑展示, 不滚动 */
.col-center{display:flex;flex-direction:column;gap:0;overflow:hidden}
.col-center > .panel{min-height:0}

.col-right{display:flex;flex-direction:column;gap:0;overflow:hidden}
.col-right > *{min-height:0}

.col-left{display:flex;flex-direction:column;overflow:hidden}
.col-left > .panel{flex:1 1 auto;min-height:0}

/*  全局: 所有 panel 内部隐藏滚动条 */
.panel *::-webkit-scrollbar{display:none}
.panel *{scrollbar-width:none}

/* 响应式:缩小右侧 */
/* 持仓交易详情面板 */
.trade-detail{background:var(--bg-1);border-top:1px solid var(--line);padding:8px 12px;font-size:11px;font-family:var(--mono);max-height:120px;overflow-y:auto}
.trade-detail .td-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--ink-70);font-size:10px;letter-spacing:1.5px}
.trade-detail .td-line{display:grid;grid-template-columns:60px 80px 80px 80px 1fr;gap:8px;padding:3px 0;border-bottom:1px solid var(--ink-20)}
.trade-detail .td-line:last-child{border-bottom:none}
.trade-detail .td-action.buy{color:var(--up)}
.trade-detail .td-action.sell{color:var(--down)}
.trade-detail .td-qty{color:var(--ink-50)}
.trade-detail .td-price{color:var(--ink-90)}
.trade-detail .td-time{color:var(--ink-50)}
.trade-detail .td-reason{color:var(--ink-70);font-size:10px}

/* symbol 选择按钮 */
.sym-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);font-size:10px;color:var(--ink-50);cursor:pointer;font-family:var(--mono);letter-spacing:.3px;transition:all .15s;margin-right:4px}
.sym-chip:hover{color:var(--ink-90);border-color:var(--celadon-dim)}
.sym-chip.active{background:rgba(91,143,185,.18);border-color:var(--celadon);color:var(--celadon-bright)}
@media(max-width:1400px){.stage{grid-template-columns:230px 1fr 250px}}
@media(max-width:1200px){.stage{grid-template-columns:200px 1fr 230px}}

/* 面板内细滚动条 — 内容可见, 滚动条不显眼 */
.panel-body::-webkit-scrollbar{width:5px;height:5px}
.panel-body::-webkit-scrollbar-track{background:transparent}
.panel-body::-webkit-scrollbar-thumb{background:var(--bg-5);border-radius:3px}
.panel-body::-webkit-scrollbar-thumb:hover{background:var(--bg-6)}

/* Panel 折叠/展开 */
.panel-head{cursor:pointer;user-select:none;position:relative}
.panel-head::after{content:"▼";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--ink-50);transition:transform .2s}
.panel.is-collapsed .panel-head::after{transform:translateY(-50%) rotate(-90deg)}
.panel.is-collapsed .panel-body{max-height:0 !important;padding-top:0 !important;padding-bottom:0 !important;overflow:hidden;border-top:none;opacity:0}
.panel .panel-body{transition:max-height .25s ease,padding .25s ease,opacity .2s ease}
/* 折叠时 panel 整体缩小 — 让下面的 panel 顶上来 */
.panel.is-collapsed{flex:0 0 auto !important;min-height:auto !important}
.panel.is-collapsed .panel-head{border-bottom:none}
.panel:not(.is-collapsed){flex:1 1 auto;min-height:0}

/* 右上角时间三联排 */
.hdr .right{display:flex;align-items:center;gap:14px}
.clock-trio{display:flex;gap:10px;padding:4px 10px;background:rgba(18,30,48,.6);border:1px solid var(--line);border-radius:4px}
.clk-item{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.clk-label{font-size:8px;color:var(--ink-50);letter-spacing:1.5px}
.clk-val{font-size:11px;color:var(--ink-90);font-family:var(--mono,'Menlo',monospace);font-weight:600}
.clk-item[data-session="open"] .clk-val{color:var(--success)}
.clk-item[data-session="break"] .clk-val{color:var(--warning)}
.clk-item[data-session="closed"] .clk-val{color:var(--danger)}
.mt-ico{display:inline-block;width:1em;height:1em;vertical-align:-0.125em;flex:none}

<script>
/* LIVE 模式切换 */
var LIVE_MODES=['DRY_RUN','PAPER','LIVE'];
window.setLiveMode = function(m){
    if(m==='LIVE'){
        var ok=confirm(' '+TZ('切到 LIVE 后, 每一次下单都是真金白银!\\n确认继续?').replace(/\\n/g,'\n'));
        if(!ok) return;
        var ok2=confirm(' '+TZ('二次确认: 真的要让 AI 军团直接对接中信证券 API 吗?'));
        if(!ok2) return;
    }
    fetch('/api/live/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})}).then(r=>r.json()).then(d=>{
        document.getElementById('lbMode').textContent=d.current_mode;
        if(d.current_mode==='LIVE'){document.querySelector('.live-banner').style.background='linear-gradient(90deg,#dc2626 #991b1b)';}
        else if(d.current_mode==='PAPER'){document.querySelector('.live-banner').style.background='linear-gradient(90deg,#d97706,#92400e)';}
        else{document.querySelector('.live-banner').style.background='linear-gradient(90deg,#059669,#065f46)';}
    });
};
// 初始模式
fetch('/api/live/mode').then(r=>r.json()).then(d=>{
    if(d.current_mode) document.getElementById('lbMode').textContent=d.current_mode;
});
</script>

/* ─── 工具 ─── */
const fmt=(n,d=2)=>{if(n==null)return'—';const s=Number(n).toFixed(d);return s};
const fmtY=(v)=>v==null?'—':v>=0?`¥${fmt(v)}`:`¥-${fmt(Math.abs(v))}`;
const fmtPct=(p)=>p==null?'—':`${fmt(Math.abs(p))}%`;
const colorCls=(v)=>v>0?'up':v<0?'down':'';
const _esc=(s)=>String(s||'').replace(/[<>&"']/g,c=>({'<':'<','>':'>','&':'&','"':'"',"'":'\''})[c]);
const $=(id)=>document.getElementById(id);

/* ─── 主刷新 ─── */
async function refreshAll(){
  const sig=AbortSignal.timeout(4000);
  try{
    const r=await Promise.all([
      fetch(API+'/status',{signal:sig}).then(r=>r.json()).catch(()=>({})),
      fetch(API+'/account',{signal:sig}).then(r=>r.json()).catch(()=>({})),
      fetch(API+'/positions',{signal:sig}).then(r=>r.json()).catch(()=>({})),
      fetch(API+'/events',{signal:sig}).then(r=>r.json()).catch(()=>({})),
      fetch(API+'/decisions',{signal:sig}).then(r=>r.json()).catch(()=>({})),
      fetch(API+'/trades',{signal:sig}).then(r=>r.json()).catch(()=>({})),
      fetch(API+'/radar',{signal:sig}).then(r=>r.json()).catch(()=>({})),
      fetch(API+'/ai-agents',{signal:sig}).then(r=>r.json()).catch(()=>({})),
    ]);
    const [s,a,p,e,d,t,r2,ai]=r;
    renderHeader(s,a);
    renderAccount(a,p);
    renderRisk(a,p);
    renderDaemons(s);
    renderPositions(p);
    renderEvents(e);
    renderDecisions(d);
    renderTrades(t);
    renderRadar(r2);
    renderAI(ai);
    // 缓存持仓和交易数据 (给 K 线图和交易详情用)
    // API 超时失败时保留旧 cache,不覆盖成空数组
    if(p?.data?.length)positionsCache=p.data;
    if(t?.data?.length)tradesCache=t.data;
    // K 线图只在第一次初始化,之后由用户手动切换 symbol
    if(!chartBuilt){
      const firstSym=(positionsCache[0]?.symbol)||'601012';
      initChart(firstSym, positionsCache, tradesCache);
      chartBuilt=true;
    }
    // chart legend 和交易详情每次刷新都更新(纯 DOM,不重建 ECharts)
    renderChartLegend(positionsCache, tradesCache);
    renderTradeDetail(currentChartSym, positionsCache, tradesCache);
  }catch(err){console.warn('[refresh fail]',err)}
}

/* ─── 顶栏 ─── */
function renderHeader(s,a){
  const hb=s?.data?.heartbeat||{};
  const phase=s?.data?.phase||hb.phase||'—';
  const mp=s?.data?.market_phase||hb.market_phase||'';
  const tick=hb.tick||'—';
  $('hdrTick').textContent=`TICK · #${tick}`;
  $('hdrPhase').textContent=TZ(phase);
  const phaseMap={pre_open:'auction',pre:'auction',call:'auction',lunch:'close',closed:'close',close:'close',weekend:'close'};
  $('hdrPhase').className='phase '+(phaseMap[mp]||'');
  // hdrTime fixed
  const total=a?.data?.total_assets||0;
  const pnl=a?.data?.pnl||0;
  $('hdrStatus').textContent=`¥${fmt(total,0)} · ${pnl>=0?'+':''}¥${fmt(pnl)}`;
}

/* ─── 账户 KPI ─── */
function renderAccount(a,p){
  const d=a?.data||{};
  const pnlCls=d.pnl>=0?'up':d.pnl<0?'down':'';
  const grid=[
    {k:TZ('总资金'),v:`¥${fmt(d.total_assets,2)}`,cls:'gold'},
    {k:TZ('持仓市值'),v:`¥${fmt(d.positions_value,2)}`},
    {k:TZ('可用资金'),v:`¥${fmt(d.available,2)}`},
    {k:TZ('持仓数'),v:`${p?.data?.length||0} 只`},
    {k:TZ('累计盈亏'),v:`${d.pnl>=0?'+':''}¥${fmt(d.pnl,2)}`,cls:pnlCls},
    {k:TZ('收益率'),v:`${d.pnl_pct>=0?'+':''}${fmt(d.pnl_pct,2)}%`,cls:pnlCls},
  ];
  // <i class="mt-ico" data-icon="tag" aria-hidden="true"></i> 古灵阁保险箱行
  const gob = a?.data?.gobelin_savings||0;
  const gob_count = a?.data?.gobelin_lock_count||0;
  const gob_date = a?.data?.gobelin_last_lock||'—';
  const gobRow = gob > 0
    ? `<div class="k gold" style="grid-column:span 2;border-top:1px solid var(--line)"><div class="label"><i class="mt-ico" data-icon="bank" aria-hidden="true"></i> ${TZ('古灵阁保险箱 · 累计锁利')} ${gob_count}次 · ${gob_date}</div><div class="val">¥${fmt(gob,2)}</div></div>`
    : `<div class="k gold" style="grid-column:span 2;border-top:1px solid var(--line)"><div class="label"><i class="mt-ico" data-icon="bank" aria-hidden="true"></i> ${TZ('古灵阁保险箱 · 尚未锁利')}</div><div class="val" style="color:var(--ink-50)">¥0.00</div></div>`;
  $('acctGrid').innerHTML=grid.map(g=>`
    <div class="k ${g.cls||''}"><div class="label">${g.k}</div><div class="${g.cls?'v':'val'}">${g.v}</div></div>
  `).join('') + gobRow;
  $('acctTs').textContent=d.ts||'';
}

/* ─── 风控研判 ─── */
function renderRisk(a,p){
  const arr=p?.data||[];
  const total=arr.reduce((s,x)=>s+(x.market_value||0),0)||1;
  // 全部持仓加权,HHI 基于全部持仓
  const weighted=arr.map(x=>({...x,w:((x.market_value||0)/total)*100}));
  const hhi=weighted.reduce((s,x)=>s+x.w*x.w,0);
  // 渲染全部持仓集中度条(前3名用 special color,其余用 other)
  const barCls=['top1','top2','top3','other'];
  const lines=weighted.map((x,i)=>`
    <div class="conc-row">
      <span class="name">${_esc(x.name)}</span>
      <div class="bar ${i<3?barCls[i]:'other'}"><i style="width:${x.w}%"></i></div>
      <span class="pct">${fmt(x.w,0)}%</span>
    </div>
  `).join('');
  $('concWrap').innerHTML=lines;
  $('hhiBar').innerHTML=`
    <div class="h ${hhi>2500?'hi':''}"><div class="lk">HHI</div><div class="lv">${fmt(hhi,0)}</div></div>
    <div class="h"><div class="lk">TOP3</div><div class="lv">${fmt(weighted.slice(0,3).reduce((s,x)=>s+x.w,0),0)}%</div></div>
    <div class="h"><div class="lk">POS</div><div class="lv">${arr.length}</div></div>
    <div class="h"><div class="lk">CASH</div><div class="lv">${fmt((a?.data?.available||0)/total*100,0)}%</div></div>
  `;
  const advice=[];
  if(hhi>2500)advice.push('<i class="mt-ico" data-icon="alert" aria-hidden="true"></i> '+TZ('HHI 偏高,持仓过度集中'));
  if(weighted[0]&&weighted[0].w>50)advice.push(`<i class="mt-ico" data-icon="warning" aria-hidden="true"></i> ${weighted[0].name} ${TZ('占比 >50%,建议减仓')}`);
  if(arr.length<3)advice.push('<i class="mt-ico" data-icon="warning" aria-hidden="true"></i> '+TZ('持仓数量偏少,建议分散'));
  if((a?.data?.available||0)/total<0.1)advice.push('<i class="mt-ico" data-icon="warning" aria-hidden="true"></i> '+TZ('现金垫不足 10%'));
  $('riskAdvice').innerHTML=advice.join('<br>')||'<span style="color:var(--celadon-bright)"><i class="mt-ico" data-icon="check" aria-hidden="true"></i> '+TZ('持仓健康 · 无重大风险')+'</span>';
}

function renderEvents(e){

}

/* ─── K 线图 (ECharts) ─── */
let _chartLang='';  // 语言切换时在 renderChartLegend 触发重建, 使 series 名随 TZ 更新
function initChart(sym, positions, trades){
  const host=$('chartHost');
  if(!host)return;
  const pos=(positions||[]).find(p=>p.symbol===sym);
  const name=pos?.name||sym;
  $('chartTitle').textContent=`K·LINE · ${name} · ${sym}`;
  if(!chartInst){
    chartInst=echarts.init(host,'dark');
    window.addEventListener('resize',()=>chartInst&&chartInst.resize());
  }
  // 只在 symbol 变化时重建 K 线数据
  const data=genMockKline(60);
  const ma5=data.map((_,i)=>calcMA(data,i,5));
  const ma10=data.map((_,i)=>calcMA(data,i,10));
  const ma20=data.map((_,i)=>calcMA(data,i,20));
  // 当前 symbol 的交易点  叠加到 chart 最后一根
  const symTrades=(trades||[]).filter(t=>t.symbol===sym);
  const lastIdx=data.length-1;
  const buyMarks=symTrades.filter(t=>(t.action||'').toUpperCase()==='BUY').map((t,i)=>({
    name:TZ('买入'),
    xAxis:lastIdx,
    yAxis:t.fill_price,
    symbol:'triangle',
    symbolSize:10,
    itemStyle:{color:'#C45656'},
    label:{show:false},
    z:10
  }));
  const sellMarks=symTrades.filter(t=>(t.action||'').toUpperCase()==='SELL').map((t,i)=>({
    name:TZ('卖出'),
    xAxis:lastIdx,
    yAxis:t.fill_price,
    symbol:'triangle',
    symbolRotate:180,
    symbolSize:10,
    itemStyle:{color:'#4FBF7A'},
    label:{show:false},
    z:10
  }));
  chartInst.setOption({
    backgroundColor:'transparent',
    grid:{top:10,right:10,bottom:30,left:60},
    xAxis:{type:'category',data:data.map(d=>d.t),axisLine:{lineStyle:{color:'#1E2E45'}},axisLabel:{color:'#6B8AA4',fontFamily:'JetBrains Mono',fontSize:10},axisTick:{show:false}},
    yAxis:{type:'value',scale:true,splitLine:{lineStyle:{color:'#142238'}},axisLabel:{color:'#6B8AA4',fontFamily:'JetBrains Mono',fontSize:10}},
    tooltip:{trigger:'axis',backgroundColor:'#0B1220',borderColor:'#1E2E45',textStyle:{color:'#D8E6EE',fontFamily:'JetBrains Mono',fontSize:11}},
    dataZoom:[{type:'inside',start:60,end:100},{type:'slider',height:18,bottom:4,borderColor:'#1E2E45',fillerColor:'rgba(91,143,185,.12)',handleStyle:{color:'#5B8FB9'}}],
    series:[
      {name:TZ('K线'),type:'candlestick',data:data.map(d=>[d.o,d.c,d.l,d.h]),
        itemStyle:{color:'#C45656',color0:'#4FBF7A',borderColor:'#C45656',borderColor0:'#4FBF7A'},
        markPoint:{symbol:'triangle',symbolSize:10,data:[...buyMarks,...sellMarks],animation:false}
      },
      {name:TZ('5日'),type:'line',data:ma5,smooth:true,symbol:'none',lineStyle:{width:1,color:'#E8C87C'}},
      {name:TZ('10日'),type:'line',data:ma10,smooth:true,symbol:'none',lineStyle:{width:1,color:'#8CCBE4'}},
      {name:TZ('20日'),type:'line',data:ma20,smooth:true,symbol:'none',lineStyle:{width:1,color:'#6FA88B'}},
    ]
  });
  _chartLang=_gobelinLang;
  currentChartSym=sym;
  chartData={sym,name,data};
}

function genMockKline(n=60){
  const out=[],base=11.0,step=0.18;
  for(let i=0;i<n;i++){
    const o=base+Math.sin(i*0.3)*step*2+Math.random()*step;
    const c=o+(Math.random()-0.5)*step*2;
    const h=Math.max(o,c)+Math.random()*step;
    const l=Math.min(o,c)-Math.random()*step;
    const d=new Date(Date.now()-(n-i)*86400000);
    out.push({t:String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'),o:+o.toFixed(2),c:+c.toFixed(2),h:+h.toFixed(2),l:+l.toFixed(2)});
  }
  return out;
}
function calcMA(data,i,n){
  if(i<n-1)return null;
  let s=0;for(let j=i-n+1;j<=i;j++)s+=data[j].c;
  return +(s/n).toFixed(2);
}
function renderChartLegend(positions, trades){
  // 语言已切换但图表停留在旧语言 → 重建(series/markPoint 名随 TZ 更新)
  if(chartInst&&_gobelinLang!==_chartLang){initChart(currentChartSym,positionsCache,tradesCache);}
  const syms=(positions||[]).map(p=>({s:p.symbol,n:p.name}));
  const chips=syms.map(x=>`<button type="button" class="sym-chip ${x.s===currentChartSym?'active':''}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="switchChart('${x.s}')">${_esc(x.n)} ${x.s}</button>`).join('');
  $('chartLegend').innerHTML=`
    <span class="cl" style="color:var(--obsidian-bright)"><i style="background:var(--obsidian-bright)"></i>MA5</span>
    <span class="cl" style="color:var(--celadon-bright)"><i style="background:var(--celadon-bright)"></i>MA10</span>
    <span class="cl" style="color:var(--plum)"><i style="background:var(--plum)"></i>MA20</span>
    <span class="cl"><i style="background:var(--up)"></i>${TZ('涨')}</span>
    <span class="cl"><i style="background:var(--down)"></i>${TZ('跌')}</span>
    <span style="margin-left:auto">${chips}</span>
  `;
}
function switchChart(sym){
  if(sym===currentChartSym)return;
  initChart(sym, positionsCache, tradesCache);
  renderChartLegend(positionsCache, tradesCache);
  renderTradeDetail(sym, positionsCache, tradesCache);
}
function highlightChart(sym){
  switchChart(sym);
}
function renderTradeDetail(sym, positions, trades){
  const el=$('tradeDetail');
  if(!sym){el.innerHTML='';return}
  const pos=(positions||[]).find(p=>p.symbol===sym);
  const symTrades=(trades||[]).filter(t=>t.symbol===sym).sort((a,b)=>{
    const ta=a.time||'';const tb=b.time||'';return ta<tb?-1:ta>tb?1:0
  });
  if(!symTrades.length){
    el.innerHTML=`<div class="td-head"><i class="mt-ico" data-icon="package" aria-hidden="true"></i> ${_esc(pos?.name||sym)} · ${sym} — ${TZ('暂无交易记录')}</div>`;
    return;
  }
  // 聚合 BUY/SELL
  const buys=symTrades.filter(t=>(t.action||'').toUpperCase()==='BUY');
  const sells=symTrades.filter(t=>(t.action||'').toUpperCase()==='SELL');
  const buyAvg=buys.length?(buys.reduce((s,t)=>s+(t.fill_price*t.fill_qty),0)/buys.reduce((s,t)=>s+t.fill_qty,0)).toFixed(2):pos?.avg_cost||'—';
  const sellAvg=sells.length?(sells.reduce((s,t)=>s+(t.fill_price*t.fill_qty),0)/sells.reduce((s,t)=>s+t.fill_qty,0)).toFixed(2):'—';
  const totalBuy=buys.reduce((s,t)=>s+t.fill_qty,0);
  const totalSell=sells.reduce((s,t)=>s+t.fill_qty,0);
  const lines=symTrades.map(t=>{
    const act=(t.action||'').toUpperCase()==='BUY'?'BUY':'SELL';
    const cls=(t.action||'').toUpperCase()==='BUY'?'buy':'sell';
    return `<div class="td-line">
      <span class="td-action ${cls}">${act}</span>
      <span class="td-price">¥${fmt(t.fill_price,2)}</span>
      <span class="td-qty">×${t.fill_qty}</span>
      <span class="td-time">${t.time||''}</span>
      <span class="td-reason">${_esc(t.reason||'')}</span>
    </div>`;
  }).join('');
  el.innerHTML=`
    <div class="td-head">
      <i class="mt-ico" data-icon="package" aria-hidden="true"></i> ${_esc(pos?.name||sym)} · ${sym}
      · ${TZ('买入均价')} <span style="color:var(--up)">¥${buyAvg}</span> (${totalBuy}股)
      · ${TZ('卖出均价')} <span style="color:var(--down)">${sellAvg==='—'?'—':'¥'+sellAvg}</span> (${totalSell}股)
      ${pos?`· 现价 ¥${fmt(pos.cur_price,2)} · 盈亏 <span class="${pos.pnl>=0?'up':'down'}">${pos.pnl>=0?'+':''}¥${fmt(pos.pnl,2)}</span>`:''}
    </div>
    ${lines}
  `;
}

window.togglePanel = function(headEl) {

    if (!panel) return;
    panel.classList.toggle('is-collapsed');

    if (title) {

        } catch(e) {}
    }
};
(function restorePanels() {
    document.querySelectorAll('.panel').forEach(function(panel) {

        if (!t) return;
        try {
            var k = 'panel_collapse_' + t.textContent.trim().replace(/[^a-zA-Z0-9]/g, '_');
            if (localStorage.getItem(k) === '1') panel.classList.add('is-collapsed');
        } catch(e) {}
    });
})();

<script>
(function(){
    function tick(){
        try {
            var now = new Date();
            var h = String(now.getHours()).padStart(2,'0');
            var m = String(now.getMinutes()).padStart(2,'0');
            var s = String(now.getSeconds()).padStart(2,'0');
            var hm = h+':'+m+':'+s;

            var elL = document.getElementById('clkLocal');
            if(elL) elL.textContent = hm;

            var elS = document.getElementById('clkServer');
            if(elS) elS.textContent = hm;

            var hour = now.getHours();
            var status = 'closed';
            var label = TZ('非交易时段');
            if((hour===9 && now.getMinutes()>=30) || hour===10 || hour===11 || hour===13 || hour===14){
                status = 'open';
                if(hour<=11) label = TZ('上午 9:30-11:30');
                else label = TZ('下午 13:00-15:00');
            } else if(hour===12){
                status = 'break';
                label = TZ('午休');
            } else if(hour===15){
                label = TZ('收市 15:00');
            }

            var elW = document.getElementById('clkSessionWrap');
            var elC = document.getElementById('clkSession');
            if(elW) elW.setAttribute('data-session', status);
            if(elC) elC.textContent = label;
        } catch(e) {
            console.warn('clock tick err:', e);
        }
    }
    tick();
    setInterval(tick, 1000);
})();
