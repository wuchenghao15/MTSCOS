<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs>
<linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#E0E7FF"/>
<stop offset="0.5" stop-color="#818CF8"/>
<stop offset="1" stop-color="#312E81"/>
</linearGradient>
<linearGradient id="u" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4338CA"/>
<stop offset="1" stop-color="#0F172A"/>
</linearGradient>
</defs>
<rect width="100" height="100" fill="#0B0A1E"/>
<!-- 3 颗仙女座星 (关联性!) -->
<circle cx="50" cy="14" r="2.5" fill="#FCD34D"/>
<circle cx="40" cy="20" r="1.2" fill="#A78BFA"/>
<circle cx="60" cy="20" r="1.2" fill="#A78BFA"/>
<line x1="50" y1="16" x2="50" y2="28" stroke="#FCD34D" stroke-width="0.6" opacity="0.5"/>
<!-- 冰山 Peak (10% 可见) -->
<polygon points="50,28 72,55 28,55" fill="url(#p)"/>
<!-- 冰山水下 3 层 (90% 隐藏) -->
<polygon points="32,55 68,55 60,72 40,72" fill="url(#u)" opacity="0.92"/>
<polygon points="40,72 60,72 55,86 45,86" fill="#1E1B4B" opacity="0.95"/>
<!-- 水面分隔 -->
<line x1="24" y1="55" x2="76" y2="55" stroke="#A78BFA" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.6"/>
</svg>