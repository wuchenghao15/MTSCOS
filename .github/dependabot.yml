# Dependabot 安全扫描配置
# https://docs.github.com/en/code-security/dependabot
#
# 说明: 仓库有 ~18 个 requirements.txt 分散在 ai_engines/_xxx_fusion/ 子目录
# (外部融合进来的示例代码), 全部依赖老版本库导致 736 虚假漏洞告警
# 这里只扫描 flask-app/ 主目录的核心依赖文件

version: 2

updates:
  # Python 主依赖
  - package-ecosystem: "pip"
    directory: "/flask-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    ignore:
      # 这些是外部融合代码, 不影响主系统
      - dependency-name: "*"
        directories:
          - "/flask-app/ai_engines/_*_fusion"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
