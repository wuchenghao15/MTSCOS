name: XiaolongIOS
options:
  bundleIdPrefix: com.mtscos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    INFOPLIST_FILE: XiaolongIOS/Info.plist
    CODE_SIGN_STYLE: Automatic
targets:
  XiaolongIOS:
    type: application
    platform: iOS
    sources:
      - XiaolongIOS
    info:
      path: XiaolongIOS/Info.plist
      properties:
        CFBundleDisplayName: 小龙
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # Tailscale/局域网 HTTP 直连
        NSLocalNetworkUsageDescription: 连接局域网/Tailscale 内的 MTSCOS 服务器
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
